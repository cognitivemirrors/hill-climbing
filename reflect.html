<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Browser-chrome tint — explicit so Chrome Android (which ignores
       background-sampling) matches the dark page like iOS Safari does. -->
  <meta name="theme-color" content="#0a0b12">
  <title>Reflect · Hill Climbing</title>
  <!-- ── PWA: installable app shell ───────────────────────────── -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Reflect">
  <style>
    :root {
      /* ── Hill Climbing — shared design tokens ─────────────────── */
      --bg-base: #0a0b12;
      --panel:   rgba(255,255,255,0.04);
      --line:    rgba(255,255,255,0.10);
      --line-strong: rgba(255,255,255,0.20);
      --text:  rgba(255,255,255,0.86);
      --mid:   rgba(255,255,255,0.55);
      --dim:   rgba(255,255,255,0.34);
      --faint: rgba(255,255,255,0.16);
      --font-display: Georgia, 'Times New Roman', serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --radius-pill: 999px;
      --ease: 0.25s ease;
      /* ── Per-practice accent — Reflect (amber) ────────────────── */
      --accent:      hsl(38,80%,66%);
      --accent-soft: hsla(38,75%,64%,0.5);
      --accent-glow: hsla(38,68%,52%,0.13);
      /* rating-scale endpoints (warm = high, cool = low) */
      --warm:  hsl(38,75%,64%);
      --cool:  hsl(214,70%,68%);
      --bg: var(--bg-base);        /* legacy alias (topbar fade) */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg-base); color: var(--text); }
    body {
      font-family: var(--font-ui);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      padding: 64px 20px 90px;
      background:
        radial-gradient(ellipse 120% 48% at 50% -6%, var(--accent-glow), transparent 60%) fixed,
        var(--bg-base);
    }

    /* ── top bar ────────────────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 10;
      background: linear-gradient(var(--bg) 55%, rgba(12,14,20,0));
      pointer-events: none;
    }
    .corner {
      position: fixed; top: 16px; font-size: 11px; color: var(--dim);
      letter-spacing: 0.06em; z-index: 11;
    }
    #version-label { top: 22px; left: 62px; }

    /* Corner menu — a single icon that opens a small data-management dropdown.
       Mirrors #home-link's round button on the right (ported from nourish). */
    #menu { position: fixed; top: 11px; right: 18px; z-index: 12; }
    #menu-btn {
      width: 34px; height: 34px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 999px; border: 1px solid rgba(255,255,255,0.12);
      color: var(--dim); background: transparent; cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    #menu-btn:hover, #menu.open #menu-btn { color: var(--accent); border-color: var(--accent-soft); }
    #menu-btn svg { width: 16px; height: 16px; display: block; }
    #menu-panel {
      position: absolute; top: 42px; right: 0; width: 232px;
      background: rgba(20,20,34,0.97); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 8px; animation: fadeUp 0.18s ease;
    }
    .menu-head {
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim); padding: 8px 10px 6px;
    }
    .menu-item {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      width: 100%; text-align: left; padding: 9px 10px; border: none; border-radius: 8px;
      background: transparent; color: var(--text); cursor: pointer;
      font-family: var(--font-ui); transition: background 0.15s;
    }
    .menu-item:hover { background: rgba(255,255,255,0.06); }
    .menu-item-title { font-size: 14px; letter-spacing: 0.02em; }
    .menu-item-sub { font-size: 11px; color: var(--dim); }
    .menu-note { font-size: 10.5px; color: var(--faint); padding: 8px 10px 4px; line-height: 1.5; }

    /* Home / all-practices link — returns to the hub. Top-left; the version
       label sits to its right. z-index above the topbar + corners. */
    #home-link {
      position: fixed; top: 11px; left: 18px; z-index: 12;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--dim); text-decoration: none;
      cursor: pointer; user-select: none;
      transition: color 0.2s, border-color 0.2s;
    }
    #home-link:hover { color: var(--accent); border-color: var(--accent-soft); }
    #home-link svg { width: 16px; height: 16px; display: block; }

    #mode-nav {
      position: fixed; top: 11px; left: 50%; transform: translateX(-50%); z-index: 11;
      display: flex; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 3px; gap: 2px;
    }
    .mode-btn {
      padding: 5px 16px; border-radius: 14px; border: none; background: transparent;
      color: var(--dim); font-size: 11px; letter-spacing: 0.08em; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .mode-btn.active { background: rgba(255,255,255,0.1); color: var(--text); }

    main { max-width: 620px; margin: 0 auto; }

    /* ── write view ─────────────────────────────────────────────── */
    .meta-line {
      font-size: 11px; color: var(--dim); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .prompt-line {
      font-family: var(--font-display); font-style: italic;
      font-size: 19px; line-height: 1.5; color: var(--mid); margin-bottom: 16px;
    }
    #entry-text {
      width: 100%; min-height: 210px; resize: none; display: block;
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      color: var(--text); font-family: var(--font-display); font-size: 16px; line-height: 1.8;
      padding: 18px 20px; outline: none; transition: border-color 0.2s;
    }
    #entry-text:focus { border-color: var(--accent-soft); }
    #entry-text::placeholder { color: var(--faint); }

    .scales { display: flex; gap: 16px; margin-top: 20px; flex-wrap: wrap; }
    .scale-block {
      flex: 1; min-width: 220px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 14px; padding: 15px 18px 16px;
    }
    .scale-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .scale-label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mid); }
    .scale-value { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .scale { display: flex; gap: 7px; }
    .dot {
      flex: 1; height: 26px; border-radius: 7px; padding: 0;
      border: 1px solid rgba(255,255,255,0.14); background: transparent;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .dot:hover { border-color: rgba(255,255,255,0.32); }
    .dot.on { border-color: transparent; }
    .scale-anchors {
      display: flex; justify-content: space-between; margin-top: 9px;
      font-size: 10px; color: var(--faint); letter-spacing: 0.05em;
    }

    /* ── photos (write-view draft strip + add button) ───────────── */
    .photo-strip { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; margin-top: 14px; }
    .photo-item { width: 84px; display: flex; flex-direction: column; gap: 4px; animation: fadeUp 0.2s ease; }
    .photo-thumb {
      position: relative; width: 84px; height: 84px; border-radius: 10px;
      overflow: hidden; border: 1px solid var(--line);
    }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-item .photo-cap {
      font-size: 9.5px; line-height: 1.35; color: var(--dim);
      max-height: 51px; overflow: hidden;
    }
    .photo-remove {
      position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      border: none; border-radius: 50%; background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.85); font-size: 14px; line-height: 1; cursor: pointer;
    }
    .photo-remove:hover { background: rgba(0,0,0,0.75); }
    #add-photo-btn {
      height: 34px; padding: 0 16px; border-radius: 17px;
      border: 1px dashed rgba(255,255,255,0.22); background: transparent;
      color: var(--dim); font-size: 12px; letter-spacing: 0.05em; cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    #add-photo-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.4); }
    #add-photo-btn:disabled { opacity: 0.35; cursor: default; }
    #photo-busy { font-size: 11px; color: var(--dim); letter-spacing: 0.05em; align-self: center; }

    /* opt-in AI describe/transcribe toggle + its consent note */
    #photo-ai-toggle {
      background: none; border: none; padding: 8px 2px; align-self: center;
      color: var(--faint); font-size: 11px; letter-spacing: 0.05em; cursor: pointer;
      transition: color 0.2s;
    }
    #photo-ai-toggle:hover { color: var(--mid); }
    #photo-ai-toggle.on { color: var(--accent-soft); }
    #photo-ai-consent {
      margin-top: 12px; padding: 14px 16px; border: 1px solid var(--line);
      border-radius: 12px; background: var(--panel); animation: fadeUp 0.2s ease;
    }
    #photo-ai-consent p { font-size: 12.5px; line-height: 1.6; color: var(--mid); }
    .consent-actions { display: flex; gap: 14px; margin-top: 10px; }
    .consent-actions button {
      background: none; border: 1px solid rgba(255,255,255,0.22); border-radius: 15px;
      padding: 5px 14px; color: var(--text); font-size: 12px; cursor: pointer;
      transition: border-color 0.2s;
    }
    .consent-actions button:hover { border-color: rgba(255,255,255,0.4); }
    .consent-actions button.quiet { border: none; color: var(--dim); }
    .consent-actions button.quiet:hover { color: var(--text); }

    .write-actions { display: flex; align-items: center; gap: 18px; margin-top: 24px; }
    #save-btn {
      min-width: 124px; height: 44px; border-radius: 22px; padding: 0 26px;
      border: 1.5px solid rgba(255,255,255,0.24); background: transparent; color: var(--text);
      font-size: 13px; letter-spacing: 0.12em; cursor: pointer;
      transition: border-color 0.2s, background 0.2s, opacity 0.2s;
    }
    #save-btn:hover:not(:disabled) { border-color: rgba(255,255,255,0.46); background: rgba(255,255,255,0.05); }
    #save-btn:disabled { opacity: 0.32; cursor: default; }
    #cancel-edit-btn {
      background: none; border: none; color: var(--dim);
      font-size: 12px; letter-spacing: 0.06em; cursor: pointer; transition: color 0.2s;
    }
    #cancel-edit-btn:hover { color: var(--text); }
    #save-feedback {
      font-size: 12px; color: var(--mid); letter-spacing: 0.06em;
      opacity: 0; transition: opacity 0.3s;
    }
    #save-feedback.show { opacity: 1; }
    .hint { font-size: 11px; color: var(--faint); letter-spacing: 0.04em; margin-top: 14px; }

    /* ── history view ───────────────────────────────────────────── */
    .day-group { margin-bottom: 30px; }
    .day-header {
      font-family: var(--font-display);
      font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);
      margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .entry-card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 15px 18px; margin-bottom: 12px; animation: fadeUp 0.3s ease;
    }
    .entry-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
    .entry-time { font-size: 11px; color: var(--dim); letter-spacing: 0.05em; white-space: nowrap; }
    .entry-ratings { display: flex; gap: 14px; }
    .rating-chip { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--mid); letter-spacing: 0.03em; }
    .rating-swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .entry-text { font-family: var(--font-display); font-size: 16px; line-height: 1.75; color: var(--text); white-space: pre-wrap; word-wrap: break-word; }
    .entry-text:empty::before { content: '— check-in, no note —'; color: var(--faint); font-style: italic; }
    .entry-photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .entry-photos img {
      height: 96px; max-width: 160px; object-fit: cover; display: block;
      border-radius: 9px; border: 1px solid var(--line); cursor: zoom-in;
    }
    .entry-photo-notes { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .photo-desc { font-size: 12.5px; line-height: 1.55; color: var(--mid); font-style: italic; }
    .photo-ocr {
      font-size: 12.5px; line-height: 1.6; color: var(--mid); white-space: pre-wrap;
      border-left: 2px solid rgba(255,255,255,0.14); padding: 2px 0 2px 12px;
      max-height: 220px; overflow-y: auto;
    }

    /* full-size photo viewer */
    #lightbox {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center; padding: 20px;
      background: rgba(5,6,10,0.93); cursor: zoom-out; animation: fadeUp 0.15s ease;
    }
    #lightbox img { max-width: 94vw; max-height: 86vh; border-radius: 6px; }
    #lightbox .lb-cap { max-width: 640px; font-size: 13px; line-height: 1.55; color: var(--mid); font-style: italic; text-align: center; }
    .entry-actions { display: flex; gap: 16px; margin-top: 12px; opacity: 0; transition: opacity 0.2s; }
    .entry-card:hover .entry-actions { opacity: 1; }
    .entry-actions button {
      background: none; border: none; color: var(--dim);
      font-size: 11px; letter-spacing: 0.05em; cursor: pointer; transition: color 0.2s;
    }
    .entry-actions button:hover { color: var(--text); }
    .entry-actions button.armed { color: hsl(8,72%,64%); }

    .empty { font-family: var(--font-display); font-style: italic; text-align: center; color: var(--dim); font-size: 16px; margin-top: 84px; line-height: 1.9; }

    /* ── utils ──────────────────────────────────────────────────── */
    .hidden { display: none !important; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 560px) {
      body { padding: 60px 14px 80px; }
      #version-label { display: none; }
      .scale-block { min-width: 100%; }
      .entry-actions { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="topbar"></div>
<a id="home-link" href="index.html" title="All practices" aria-label="All practices">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V19h13V9.8"/>
  </svg>
</a>
<div class="corner" id="version-label">v0.11 · reflect</div>
<nav id="mode-nav">
  <button class="mode-btn active" data-view="write">Write</button>
  <button class="mode-btn"        data-view="history">History</button>
</nav>
<div id="menu">
  <button id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>
    </svg>
  </button>
  <div id="menu-panel" class="hidden" role="menu">
    <div class="menu-head">Your data</div>
    <button class="menu-item" id="export-btn" type="button" role="menuitem">
      <span class="menu-item-title">Export</span>
      <span class="menu-item-sub">Download your journal</span>
    </button>
    <button class="menu-item" id="import-btn" type="button" role="menuitem">
      <span class="menu-item-title">Import</span>
      <span class="menu-item-sub">Restore from a backup file</span>
    </button>
  </div>
  <input type="file" id="import-file" accept="application/json" class="hidden">
</div>

<main>
  <!-- write -->
  <section id="write-view">
    <div class="meta-line" id="write-meta"></div>
    <div class="prompt-line" id="prompt-line"></div>
    <textarea id="entry-text" placeholder="Write freely."></textarea>

    <div class="photo-strip" id="photo-strip">
      <button id="add-photo-btn" type="button">+ add a photo</button>
      <button id="photo-ai-toggle" type="button">describe photos: off</button>
      <span id="photo-busy" class="hidden">preparing…</span>
      <input type="file" id="photo-file" accept="image/*" multiple class="hidden">
    </div>
    <div id="photo-ai-consent" class="hidden">
      <p id="photo-ai-consent-text"></p>
      <div class="consent-actions">
        <button id="photo-ai-enable" type="button">Turn on</button>
        <button id="photo-ai-dismiss" type="button" class="quiet">not now</button>
      </div>
    </div>

    <div class="scales">
      <div class="scale-block">
        <div class="scale-top"><span class="scale-label">Mood</span><span class="scale-value" id="mood-value">—</span></div>
        <div class="scale" id="scale-mood"></div>
        <div class="scale-anchors"><span>low</span><span>high</span></div>
      </div>
      <div class="scale-block">
        <div class="scale-top"><span class="scale-label">Satisfaction</span><span class="scale-value" id="sat-value">—</span></div>
        <div class="scale" id="scale-sat"></div>
        <div class="scale-anchors"><span>low</span><span>high</span></div>
      </div>
    </div>

    <div class="write-actions">
      <button id="save-btn" disabled>SAVE</button>
      <button id="cancel-edit-btn" class="hidden">cancel edit</button>
      <span id="save-feedback">saved</span>
    </div>
    <div class="hint">⌘/Ctrl + Enter to save · a note, a rating, a photo — any of them</div>
  </section>

  <!-- history -->
  <section id="history-view" class="hidden">
    <div id="history-list"></div>
    <div id="history-empty" class="empty hidden">
      Nothing here yet.<br>Your first thought will land on this page.
    </div>
  </section>
</main>

<!-- ── Cross-device sync engine + status chip (opt-in, E2E-encrypted) ──── -->
<script src="/hc-sync.js"></script>
<script src="/hc-sync-chip.js"></script>
<script src="/hc-agent.js"></script>

<script>
'use strict';

// ── Config ──────────────────────────────────────────────────────────────────
const VERSION    = 'v0.11 · reflect';
const DB_NAME    = 'journal';
const STORE      = 'entries';
const SYNC_JOURNAL_NS = 'idb:reflect:entries';   // this app's registered E2E-sync log store (see hc-sync.js)
const SCALE_MAX  = 7;
// Photos are stored INSIDE the entry record as compressed JPEG data URLs, so
// they ride the existing per-entry E2EE sync log, export/import, and edit flow
// unchanged. Downscaling keeps each one small enough for that path.
const MAX_IMAGES     = 4;            // per entry
const IMG_MAX_DIM    = 1400;         // px, long edge
const IMG_QUALITY    = 0.82;         // JPEG
const IMG_SOFT_CAP   = 900 * 1024;   // if a first pass exceeds this, recompress harder
const IMG_RETRY_DIM  = 1100;
const IMG_RETRY_QUALITY = 0.7;
// Opt-in AI describe/transcribe for attached photos (OFF by default). When — and
// only when — the user enables it, each NEWLY ATTACHED photo is sent once to
// Anthropic on the user's own key (the suite's shared BYOK credential) and the
// returned description + verbatim transcription are stored on the image inside
// the entry record, so they ride the same E2EE sync / export / delete as the
// photo. Photos attached while the toggle is off are never sent anywhere.
const PHOTO_AI_LS      = 'hill-climbing-reflect-photo-ai';  // '1' = enabled
// The consent choice is REMEMBERED ACROSS DEVICES (founder request): the flag
// syncs as its own tiny E2EE blob, so enabling once — on any synced device —
// counts everywhere, and turning it off propagates the same way. '1' on / '0'
// off (an explicit '0' must win over "unset" on a fresh device).
const PHOTO_AI_SYNC_KEY = 'ls:hill-climbing-reflect-photo-ai';
const API_KEY_LS       = 'hill-climbing-api-key';           // shared BYOK credential (REQUIREMENTS A.1)
const PHOTO_AI_MODEL   = 'claude-opus-4-8';                 // one line to flip to a cheaper tier
const PHOTO_AI_MAX_TOK = 1500;
const DESC_CAP         = 600;      // chars kept from the model's description
const OCR_CAP          = 20000;    // chars kept from the transcription
const PHOTO_AI_SYSTEM =
  'You describe photos for someone’s private journal. Reply with JSON. ' +
  '"description": one or two plain, factual sentences about what the photo shows — enough to recall the moment later. ' +
  'Never name or guess who a person is, and don’t speculate about places beyond what is visibly written. ' +
  '"text": every piece of legible text in the photo, transcribed verbatim (keep line breaks); an empty string if there is none.';
const PHOTO_AI_SCHEMA = {
  type: 'object',
  properties: { description: { type: 'string' }, text: { type: 'string' } },
  required: ['description', 'text'],
  additionalProperties: false,
};
const PROMPTS = [
  'What’s present right now?',
  'What’s been asking for your attention?',
  'Name what you’re feeling, plainly.',
  'What happened today that mattered?',
  'What’s the truth you’re circling around?',
  'Where did your mind keep returning?',
  'What would you tell a friend in your position?',
];

// ── State ───────────────────────────────────────────────────────────────────
const state = {
  view:      'write',
  entries:   [],                                  // newest first
  editingId: null,
  draft:     { text: '', mood: null, satisfaction: null, images: [] },
  photoBusy: false,                               // true while compressing/describing — save waits
  pendingDelete: null,                            // {id, timer} for two-tap delete
};

// ── IndexedDB (minimal promise wrapper) ─────────────────────────────────────
let _db = null;
function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        const store = d.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('created', 'created');
      }
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror   = () => reject(req.error);
  });
}
function idbAll() {
  return db().then(d => new Promise((res, rej) => {
    const req = d.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror   = () => rej(req.error);
  }));
}
function idbPut(entry) {
  return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(entry);
    tx.oncomplete = () => res(entry);
    tx.onerror    = () => rej(tx.error);
  }));
}
function idbPutMany(items) {                 // bulk upsert — used by the sync merge (writeMany)
  return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(STORE, 'readwrite');
    const os = tx.objectStore(STORE);
    items.forEach(it => os.put(it));
    tx.oncomplete = () => res();
    tx.onerror    = () => rej(tx.error);
  }));
}
function idbDelete(id) {
  return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => res();
    tx.onerror    = () => rej(tx.error);
  }));
}

// ── Helpers ─────────────────────────────────────────────────────────────────
function uid() {
  return (crypto.randomUUID && crypto.randomUUID()) ||
         `${Date.now()}-${Math.random().toString(36).slice(2)}`;
}
function valueColor(v) {                          // 1..7 → cool → warm
  const t = (v - 1) / (SCALE_MAX - 1);
  const hue = 214 - t * (214 - 38);
  return `hsl(${hue.toFixed(0)}, 62%, 62%)`;
}
function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function dayLabel(ts) {
  const d = new Date(ts), now = new Date();
  if (dayKey(ts) === dayKey(now.getTime())) return 'Today';
  if (dayKey(ts) === dayKey(now.getTime() - 86400000)) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}
function timeLabel(ts) { return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
function escapeHTML(s) { const p = document.createElement('div'); p.textContent = s; return p.innerHTML; }

// ── Scale inputs ────────────────────────────────────────────────────────────
function renderScale(containerId, value) {
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  for (let i = 1; i <= SCALE_MAX; i++) {
    const dot = document.createElement('button');
    dot.className = 'dot' + (value && i <= value ? ' on' : '');
    if (value && i <= value) dot.style.background = valueColor(value);
    dot.dataset.v = i;
    c.appendChild(dot);
  }
}
function renderScales() {
  renderScale('scale-mood', state.draft.mood);
  renderScale('scale-sat',  state.draft.satisfaction);
  moodValue.textContent = state.draft.mood        ? `${state.draft.mood}/${SCALE_MAX}` : '—';
  satValue.textContent  = state.draft.satisfaction ? `${state.draft.satisfaction}/${SCALE_MAX}` : '—';
}
function pickScale(field, v) {
  state.draft[field] = (state.draft[field] === v) ? null : v;   // tap active to clear
  renderScales();
  refreshSaveState();
}
document.getElementById('scale-mood').addEventListener('click', e => {

});

});

// ── Photos ──────────────────────────────────────────────────────────────────
function readImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable image')); };
    img.src = url;
  });
}
function scaleToJpeg(img, maxDim, quality) {
  const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return { dataUrl: canvas.toDataURL('image/jpeg', quality), w, h };
}
async function compressImage(file) {
  const img = await readImageFile(file);
  let out = scaleToJpeg(img, IMG_MAX_DIM, IMG_QUALITY);
  if (out.dataUrl.length > IMG_SOFT_CAP) out = scaleToJpeg(img, IMG_RETRY_DIM, IMG_RETRY_QUALITY);
  return out;
}

// ── Opt-in AI describe + transcribe (BYOK — the user's own Anthropic key) ────
function photoAiOn() { return localStorage.getItem(PHOTO_AI_LS) === '1'; }
function refreshPhotoAiToggle() {
  photoAiToggle.textContent = 'describe photos: ' + (photoAiOn() ? 'on' : 'off');
  photoAiToggle.classList.toggle('on', photoAiOn());
}
function setPhotoAi(on) {
  localStorage.setItem(PHOTO_AI_LS, on ? '1' : '0');            // explicit '0', so revocation syncs too
  if (window.HCSync) HCSync.queueBlobPush(PHOTO_AI_SYNC_KEY);   // consent remembered across synced devices
  refreshPhotoAiToggle();
}
function showPhotoAiConsent() {
  const hasKey = !!localStorage.getItem(API_KEY_LS);
  if (hasKey) {
    photoAiText.textContent =
      'When this is on, each photo you attach is sent once to Anthropic — on your own API key — ' +
      'to write a short description and transcribe any visible text. Those notes are saved into the ' +
      'entry beside the photo (and ride the same encrypted sync). Like the other bring-your-own-key ' +
      'features, what is sent is readable by Anthropic under their API terms. Photos you attached ' +
      'before turning this on are never sent. You only decide this once: if sync is on, the choice ' +
      'carries to your other devices, and one tap turns it off everywhere.';
    document.getElementById('photo-ai-enable').classList.remove('hidden');
  } else {
    photoAiText.textContent =
      'Describing photos uses the suite’s shared Anthropic key, and no key is set on this device yet. ' +
      'Add your API key in Companion (or Council, or Nourish’s chef) first, then come back here.';
    document.getElementById('photo-ai-enable').classList.add('hidden');
  }
  photoAiConsent.classList.remove('hidden');
}
// Ask Anthropic for {description, text} for one just-attached photo. Failure is
// quiet — the photo is already attached and the entry works without notes.
async function describeImage(im) {
  if (!photoAiOn()) return;
  const key = localStorage.getItem(API_KEY_LS);
  if (!key) return;
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        // Required for direct browser access to the Anthropic API (BYOK — the user's own key).
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: PHOTO_AI_MODEL,
        max_tokens: PHOTO_AI_MAX_TOK,
        system: PHOTO_AI_SYSTEM,
        output_config: { format: { type: 'json_schema', schema: PHOTO_AI_SCHEMA } },
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: im.dataUrl.split(',')[1] } },
            { type: 'text', text: 'Describe this journal photo and transcribe any text in it.' },
          ],
        }],
      }),
    });
    if (!r.ok) { flashSaved('couldn’t describe the photo'); return; }
    const data = await r.json();
    if (data.stop_reason === 'refusal') return;
    const block = (data.content || []).find(b => b.type === 'text');
    const out = JSON.parse(block.text);
    if (typeof out.description === 'string' && out.description.trim()) im.desc = out.description.trim().slice(0, DESC_CAP);
    if (typeof out.text === 'string' && out.text.trim()) im.ocr = out.text.trim().slice(0, OCR_CAP);
  } catch (err) {
    flashSaved('couldn’t describe the photo');
  }
}

async function addPhotos(files) {
  state.photoBusy = true;
  photoBusy.classList.remove('hidden');
  addPhotoBtn.disabled = true;
  refreshSaveState();
  try {
    for (const f of files) {
      if (state.draft.images.length >= MAX_IMAGES) { flashSaved(`up to ${MAX_IMAGES} photos`); break; }
      let im;
      try { im = await compressImage(f); }
      catch (err) { flashSaved('couldn’t read that image'); continue; }
      state.draft.images.push(im);
      renderDraftPhotos();
      if (photoAiOn() && localStorage.getItem(API_KEY_LS)) {
        photoBusy.textContent = 'describing…';
        await describeImage(im);           // sequential: notes land before save unlocks
        renderDraftPhotos();
      }
    }
  } finally {
    state.photoBusy = false;
    photoBusy.classList.add('hidden');
    photoBusy.textContent = 'preparing…';
    renderDraftPhotos();
    refreshSaveState();
  }
}
function renderDraftPhotos() {
  photoStrip.querySelectorAll('.photo-item').forEach(el => el.remove());
  state.draft.images.forEach((im, i) => {
    const item = document.createElement('div');
    item.className = 'photo-item';
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb';
    const img = document.createElement('img');
    img.src = im.dataUrl; img.alt = im.desc || 'attached photo';
    const rm = document.createElement('button');
    rm.className = 'photo-remove'; rm.type = 'button';
    rm.textContent = '×'; rm.setAttribute('aria-label', 'Remove photo');
    rm.addEventListener('click', () => {
      state.draft.images.splice(i, 1);
      renderDraftPhotos();
      refreshSaveState();
    });
    wrap.appendChild(img); wrap.appendChild(rm);
    item.appendChild(wrap);
    if (im.desc) {                          // model output — textContent keeps it inert
      const cap = document.createElement('div');
      cap.className = 'photo-cap';
      cap.textContent = im.desc + (im.ocr ? ' · has text' : '');
      item.appendChild(cap);
    }
    photoStrip.insertBefore(item, addPhotoBtn);
  });
  addPhotoBtn.disabled = state.photoBusy || state.draft.images.length >= MAX_IMAGES;
}
// Import/sync hygiene: accept only strict base64 image data URLs, never markup;
// coerce the AI notes to bounded plain strings.
function sanitizeImages(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.slice(0, MAX_IMAGES).map(im => {
    if (!im || typeof im.dataUrl !== 'string' ||
        !/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(im.dataUrl)) return null;
    const out = { dataUrl: im.dataUrl, w: +im.w || null, h: +im.h || null };
    if (typeof im.desc === 'string' && im.desc.trim()) out.desc = im.desc.trim().slice(0, DESC_CAP);
    if (typeof im.ocr === 'string' && im.ocr.trim()) out.ocr = im.ocr.trim().slice(0, OCR_CAP);
    return out;
  }).filter(Boolean);
}
function openLightbox(dataUrl, desc) {
  const box = document.createElement('div');
  box.id = 'lightbox';
  const img = document.createElement('img');
  img.src = dataUrl; img.alt = desc || 'photo, full size';
  box.appendChild(img);
  if (desc) {
    const cap = document.createElement('div');
    cap.className = 'lb-cap';
    cap.textContent = desc;                 // model output — textContent keeps it inert
    box.appendChild(cap);
  }
  const close = () => { box.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  box.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(box);
}

// ── Write view ──────────────────────────────────────────────────────────────
function refreshSaveState() {
  const has = textEl.value.trim() || state.draft.mood || state.draft.satisfaction ||
              state.draft.images.length;
  saveBtn.disabled = !has || state.photoBusy;
}
function autoGrow() {
  textEl.style.height = 'auto';
  textEl.style.height = Math.max(210, textEl.scrollHeight) + 'px';
}
function renderWrite() {
  textEl.value = state.draft.text;
  autoGrow();
  renderDraftPhotos();
  renderScales();
  refreshSaveState();
  if (state.editingId) {
    const e = state.entries.find(x => x.id === state.editingId);
    writeMeta.textContent = `Editing · ${dayLabel(e.created)} · ${timeLabel(e.created)}`;
    promptLine.classList.add('hidden');
    saveBtn.textContent = 'UPDATE';
    cancelEdit.classList.remove('hidden');
  } else {
    writeMeta.textContent = `${dayLabel(Date.now())} · ${timeLabel(Date.now())}`;
    promptLine.textContent = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
    promptLine.classList.remove('hidden');
    saveBtn.textContent = 'SAVE';
    cancelEdit.classList.add('hidden');
  }
}
function resetDraft() {
  state.editingId = null;
  state.draft = { text: '', mood: null, satisfaction: null, images: [] };
}
function flashSaved(msg) {
  saveFeedback.textContent = msg;
  saveFeedback.classList.add('show');
  setTimeout(() => saveFeedback.classList.remove('show'), 1600);
}

async function save() {
  const text = textEl.value.trim();
  if (!text && !state.draft.mood && !state.draft.satisfaction && !state.draft.images.length) return;
  const now = Date.now();

  if (state.editingId) {
    const e = state.entries.find(x => x.id === state.editingId);
    const updated = { ...e, text, mood: state.draft.mood, satisfaction: state.draft.satisfaction,
                      images: state.draft.images, updated: now };
    await idbPut(updated);
    if (window.HCSync) HCSync.pushLogRecord(SYNC_JOURNAL_NS, updated);
    resetDraft();
    await loadEntries();
    switchView('history');
    return updated.id;
  } else {
    const entry = {
      id: uid(), created: now, updated: now,
      text, mood: state.draft.mood, satisfaction: state.draft.satisfaction,
      images: state.draft.images,
      embedding: null, embModel: null,            // reserved for the semantic-map phase
    };
    await idbPut(entry);
    if (window.HCSync) HCSync.pushLogRecord(SYNC_JOURNAL_NS, entry);
    resetDraft();
    await loadEntries();
    renderWrite();
    flashSaved('saved');
    return entry.id;
  }
}

function startEdit(id) {
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  state.editingId = id;
  state.draft = { text: e.text || '', mood: e.mood || null, satisfaction: e.satisfaction || null,
                  images: (e.images || []).slice() };
  switchView('write');
}

// ── History view ────────────────────────────────────────────────────────────
function clearPendingDelete() {
  if (state.pendingDelete) { clearTimeout(state.pendingDelete.timer); state.pendingDelete = null; }
}
function ratingChip(label, v) {
  if (!v) return '';
  return `<span class="rating-chip"><span class="rating-swatch" style="background:${valueColor(v)}"></span>${label} ${v}</span>`;
}
function renderHistory() {
  clearPendingDelete();
  historyList.innerHTML = '';
  if (!state.entries.length) { historyEmpty.classList.remove('hidden'); return; }
  historyEmpty.classList.add('hidden');

  let lastDay = null;
  let group = null;
  state.entries.forEach(e => {
    const k = dayKey(e.created);
    if (k !== lastDay) {
      lastDay = k;
      group = document.createElement('div');
      group.className = 'day-group';
      const h = document.createElement('div');
      h.className = 'day-header';
      h.textContent = dayLabel(e.created);
      group.appendChild(h);
      historyList.appendChild(group);
    }
    const card = document.createElement('div');
    card.className = 'entry-card';
    const imgs = Array.isArray(e.images) ? e.images : [];
    card.innerHTML = `
      <div class="entry-head">
        <span class="entry-time">${timeLabel(e.created)}${e.updated > e.created + 1000 ? ' · edited' : ''}</span>
        <span class="entry-ratings">${ratingChip('mood', e.mood)}${ratingChip('sat', e.satisfaction)}</span>
      </div>
      <div class="entry-text${!e.text && imgs.length ? ' hidden' : ''}">${escapeHTML(e.text || '')}</div>
      <div class="entry-actions">
        <button data-act="edit">edit</button>
        <button data-act="delete">delete</button>
      </div>`;
    if (imgs.length) {
      // Photos + AI notes are built via DOM (src property / textContent, never
      // markup) so hostile content from an import/sync merge stays inert.
      const row = document.createElement('div');
      row.className = 'entry-photos';
      const notes = document.createElement('div');
      notes.className = 'entry-photo-notes';
      imgs.forEach(im => {
        if (!im || typeof im.dataUrl !== 'string') return;
        const img = document.createElement('img');
        img.src = im.dataUrl; img.alt = im.desc || 'journal photo'; img.loading = 'lazy';
        img.addEventListener('click', () => openLightbox(im.dataUrl, im.desc));
        row.appendChild(img);
        if (im.desc) {
          const d = document.createElement('div');
          d.className = 'photo-desc';
          d.textContent = im.desc;
          notes.appendChild(d);
        }
        if (im.ocr) {
          const o = document.createElement('div');
          o.className = 'photo-ocr';
          o.textContent = im.ocr;
          notes.appendChild(o);
        }
      });
      const actions = card.querySelector('.entry-actions');
      card.insertBefore(row, actions);
      if (notes.childNodes.length) card.insertBefore(notes, actions);
    }
    card.querySelector('[data-act="edit"]').addEventListener('click', () => startEdit(e.id));
    const delBtn = card.querySelector('[data-act="delete"]');
    delBtn.addEventListener('click', () => handleDelete(e.id, delBtn));
    group.appendChild(card);
  });
}
function handleDelete(id, btn) {
  if (state.pendingDelete && state.pendingDelete.id === id) {
    clearPendingDelete();
    // Soft-delete: write a tombstone (kept in IndexedDB, hidden from the UI) so
    // the deletion propagates through sync. A hard idbDelete would leave the
    // entry alive on other devices and let it resurrect on a fresh pull.
    const e = state.entries.find(x => x.id === id);
    // Tombstones drop the photo bytes — no reason to keep (or push through
    // sync) megabytes of imagery on an entry the user deleted.
    const tomb = e
      ? { ...e, images: [], deleted: true, updated: Date.now() }
      : { id, deleted: true, created: Date.now(), updated: Date.now(), text: '', mood: null, satisfaction: null, images: [] };
    idbPut(tomb)
      .then(() => { if (window.HCSync) HCSync.pushLogRecord(SYNC_JOURNAL_NS, tomb); })
      .then(loadEntries)
      .then(() => { if (state.view === 'history') renderHistory(); });
    return;
  }
  clearPendingDelete();
  btn.textContent = 'tap again';
  btn.classList.add('armed');
  const timer = setTimeout(() => { btn.textContent = 'delete'; btn.classList.remove('armed'); state.pendingDelete = null; }, 3000);
  state.pendingDelete = { id, timer };
}

// ── View switching ──────────────────────────────────────────────────────────
function switchView(v) {
  state.view = v;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  if (v === 'write') {
    writeView.classList.remove('hidden');
    historyView.classList.add('hidden');
    renderWrite();
    textEl.focus();
  } else {
    writeView.classList.add('hidden');
    historyView.classList.remove('hidden');
    renderHistory();
  }
}

// ── Data load + export/import ───────────────────────────────────────────────
async function loadEntries() {
  const all = await idbAll();
  // Tombstones (deleted:true) stay in IndexedDB so deletions propagate through
  // sync, but they never appear in the UI or exports.
  state.entries = all.filter(e => e && !e.deleted).sort((a, b) => b.created - a.created);
}
function exportData() {
  const payload = { app: 'journal', schema: 1, exported: Date.now(), entries: state.entries };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `journal-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
async function importData(file) {
  try {
    const parsed = JSON.parse(await file.text());
    const incoming = Array.isArray(parsed) ? parsed : parsed.entries;
    if (!Array.isArray(incoming)) throw new Error('no entries array');
    let n = 0;
    for (const e of incoming) {
      if (!e || typeof e.text === 'undefined') continue;
      const rec = {
        id: e.id || uid(),
        created: e.created || Date.now(),
        updated: e.updated || e.created || Date.now(),
        text: String(e.text || ''),
        mood: e.mood ?? null,
        satisfaction: e.satisfaction ?? null,
        images: sanitizeImages(e.images),
        embedding: e.embedding ?? null,
        embModel: e.embModel ?? null,
      };
      await idbPut(rec);
      if (window.HCSync) HCSync.pushLogRecord(SYNC_JOURNAL_NS, rec);
      n++;
    }
    await loadEntries();
    switchView('history');
    flashSaved(`imported ${n}`);
    alert(`Imported ${n} entr${n === 1 ? 'y' : 'ies'} (merged by id).`);
  } catch (err) {
    alert('Import failed: ' + err.message);
  }
}

  }
});
document.getElementById('photo-ai-enable').addEventListener('click', () => {
  setPhotoAi(true);
  photoAiConsent.classList.add('hidden');
  flashSaved('photo describing on');
});
document.getElementById('photo-ai-dismiss').addEventListener('click', () => {
  photoAiConsent.classList.add('hidden');
});
// Corner data menu — open/close, close on outside-click or Esc (ported from nourish).
const menuEl = document.getElementById('menu');
const menuBtn = document.getElementById('menu-btn');
const menuPanel = document.getElementById('menu-panel');
function setMenu(open) {
  menuPanel.classList.toggle('hidden', !open);
  menuEl.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
menuBtn.addEventListener('click', () => setMenu(menuPanel.classList.contains('hidden')));
document.addEventListener('click', e => { if (!menuEl.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

document.getElementById('export-btn').addEventListener('click', () => { setMenu(false); exportData(); });
document.getElementById('import-btn').addEventListener('click', () => { setMenu(false); importFile.click(); });
importFile.addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; });

// ── Init ────────────────────────────────────────────────────────────────────
document.getElementById('version-label').textContent = VERSION;
refreshPhotoAiToggle();
(async () => {
  try {
    await loadEntries();
  } catch (err) {
    document.querySelector('main').innerHTML =
      '<div class="empty">Storage unavailable in this browser context.<br>' +
      'IndexedDB may be disabled (private window?). Your entries can’t be saved here.</div>';
    return;
  }
  switchView('write');
})();

// ── Cross-device sync (opt-in, end-to-end encrypted; see hc-sync.js) ─────────
// The journal is a LOG store, not a blob: each entry syncs as its own record so
// two devices never clobber each other's writing. Because the server's log RPC
// is insert-only (immutable), each entry version carries a version-stamped doc
// key (id@updated) — so edits and tombstoned deletes land as new rows and the
// merge below keeps the newest version per id (tombstones win, then hide).
// Sign-in / unlock live at the hub.
if (window.HCSync) {
  const SUPABASE_URL      = 'https://eztapprkcnwoebnfdebb.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_x4iSO5FsdsHutEkYf764Uw_iQeGWMR7';
  HCSync.registerStore({
    key: SYNC_JOURNAL_NS, kind: 'log',
    readAll:  () => idbAll(),                          // all local records, incl. tombstones
    recordId: (e) => e.id + '@' + (e.updated || e.created || 0),   // version-stamped → immutable rows
    writeMany: (recs) => idbAll().then((localAll) => {
      // Merge incoming versions with local, keeping the newest `updated` per id.
      const byId = {};
      localAll.forEach((e) => { if (e && e.id) byId[e.id] = e; });
      recs.forEach((e) => {
        if (!e || !e.id) return;
        const cur = byId[e.id];
        if (!cur || (e.updated || 0) >= (cur.updated || 0)) byId[e.id] = e;
      });
      return idbPutMany(Object.keys(byId).map((k) => byId[k]));
    }).then(loadEntries).then(() => { if (state.view === 'history') renderHistory(); }),
  });
  // The photo-describe consent is decided once and remembered across devices:
  // it syncs as its own tiny E2EE blob (LWW). '1' on / '0' off — never the raw
  // absence of the key, so an explicit off wins over a fresh device's unset.
  HCSync.registerStore({
    key: PHOTO_AI_SYNC_KEY, kind: 'blob',
    read:  () => photoAiOn() ? '1' : '0',
    write: (str) => {                      // remote-apply path
      try { localStorage.setItem(PHOTO_AI_LS, str === '1' ? '1' : '0'); } catch (e) { /* quota */ }
      refreshPhotoAiToggle();
    },
  });
  if (window.HCSyncChip) HCSyncChip.mount({ position: 'bottom-left' });
  HCSync.init({ supabaseUrl: SUPABASE_URL, supabaseAnonKey: SUPABASE_ANON_KEY, appId: 'reflect' });
}

// ── Agent interface (window.HC — one symmetric surface, see hc-agent.js) ─────
// Marshal action params into the live draft the way the UI does: only fields
// that were passed change; ratings validate to the same 1..7 the dots offer;
// images pass through the same sanitizeImages hygiene as import/sync.
function applyDraftParams(p) {
  const scaleVal = (v) => {
    if (v === null || v === undefined) return null;
    const n = Math.round(+v);
    if (!(n >= 1 && n <= SCALE_MAX)) throw new Error('ratings run 1..' + SCALE_MAX);
    return n;
  };
  const mood = p.mood !== undefined ? scaleVal(p.mood) : undefined;
  const sat  = p.satisfaction !== undefined ? scaleVal(p.satisfaction) : undefined;
  if (p.text !== undefined) { textEl.value = p.text == null ? '' : String(p.text); state.draft.text = textEl.value; }
  if (mood !== undefined) state.draft.mood = mood;
  if (sat  !== undefined) state.draft.satisfaction = sat;
  if (p.images !== undefined) { state.draft.images = sanitizeImages(p.images); renderDraftPhotos(); }
  renderScales();
  refreshSaveState();
}
if (window.HC) HC.register({
  app: 'reflect',
  version: VERSION,
  title: 'Reflect',
  description: 'A private journal: free writing with optional mood and satisfaction ratings (1–7) and up to four photos per entry, kept on-device and E2EE-synced.',
  stores: [
    {
      key: 'journal/entries', kind: 'idb',
      description: 'Journal entries — free text, ratings, photos stored in-record as JPEG data URLs with optional AI description/transcription. Deletes are tombstones (deleted:true) so they propagate through sync. The most sensitive store in the suite.',
      sensitivity: 'sensitive',
      schema: '{id, created, updated, text, mood:1-7|null, satisfaction:1-7|null, images:[{dataUrl,w,h,desc?,ocr?}], embedding:null, embModel:null, deleted?:true}',
      read: (opts) => idbAll().then((all) => {
        if (opts && opts.full) return all;
        return all.filter((e) => e && !e.deleted)
          .sort((a, b) => b.created - a.created)
          .map((e) => ({ ...e, images: (Array.isArray(e.images) ? e.images : []).map((im) => {
            const t = { w: im.w || null, h: im.h || null, photo: 'omitted — read with {full: true} for bytes' };
            if (im.desc) t.desc = im.desc;
            if (im.ocr)  t.ocr  = im.ocr;
            return t;
          }) }));
      }),
      exportRead: () => idbAll(),
      write: async (records) => {
        for (const rec of records || []) {
          await idbPut(rec);
          if (window.HCSync) HCSync.pushLogRecord(SYNC_JOURNAL_NS, rec);
        }
      },
    },
    {
      key: PHOTO_AI_LS, kind: 'localStorage',
      description: 'Photo describe/transcribe consent — "1" means each newly attached photo is sent once to Anthropic on the person’s own API key; the choice syncs account-wide.',
      sensitivity: 'practice',
      schema: 'raw string: "1" on | "0" off',
      syncKey: PHOTO_AI_SYNC_KEY,
      afterWrite: refreshPhotoAiToggle,
    },
  ],
  actions: {
    addEntry: {
      description: 'Save a new journal entry through the same save path a human uses. The journal records only what the person asked to write — never invented content. Needs at least one of text / mood / satisfaction / images.',
      params: {
        text: 'string — entry text (optional)',
        mood: 'integer 1-7 — mood rating (optional)',
        satisfaction: 'integer 1-7 — satisfaction rating (optional)',
        images: 'array — up to 4 pre-built {dataUrl, w, h, desc?, ocr?} objects; dataUrl must be a base64 image data URL (invalid ones are dropped, as on import) (optional)',
      },
      handler: async (p) => {
        if (state.photoBusy) throw new Error('photos are still being prepared — try again in a moment');
        resetDraft();
        renderWrite();
        applyDraftParams(p || {});
        const id = await save();
        if (!id) throw new Error('nothing to save — an entry needs a note, a rating, or a photo');
        return { id };
      },
    },
    editEntry: {
      description: 'Edit an existing entry through the same edit-and-save path a human uses; only the fields given change (pass null to clear a rating), the rest keep their current values.',
      params: {
        id: 'string — entry id (required)',
        text: 'string — replacement text (optional)',
        mood: 'integer 1-7, or null to clear (optional)',
        satisfaction: 'integer 1-7, or null to clear (optional)',
        images: 'array — replacement image set, same shape as addEntry (optional)',
      },
      handler: async (p) => {
        if (state.photoBusy) throw new Error('photos are still being prepared — try again in a moment');
        if (!p || !state.entries.some((x) => x.id === p.id)) throw new Error('no entry with that id');
        startEdit(p.id);
        applyDraftParams(p);
        const id = await save();
        if (!id) throw new Error('nothing to save — an entry needs a note, a rating, or a photo');
        return { id };
      },
    },
    deleteEntry: {
      description: 'Delete an entry (destructive): writes the same sync-propagating tombstone the two-tap UI delete commits — photo bytes dropped, entry hidden everywhere once synced.',
      params: { id: 'string — entry id (required)' },
      handler: (p) => {
        if (!p || !state.entries.some((x) => x.id === p.id)) throw new Error('no entry with that id');
        state.pendingDelete = { id: p.id, timer: 0 };
        handleDelete(p.id);
        return { ok: true };
      },
    },
    setPhotoAi: {
      description: 'Turn the photo describe/transcribe consent on or off. Plainly: when on, each newly attached photo is sent once to Anthropic on the person’s own API key, and turning it on is an account-wide consent that syncs to every device. Set it only at the person’s explicit, informed request.',
      params: { on: 'boolean — required' },
      handler: (p) => {
        if (!p || typeof p.on !== 'boolean') throw new Error('setPhotoAi needs {on: true|false}');
        setPhotoAi(p.on);
        return { on: photoAiOn() };
      },
    },
  },
  notes: 'The journal is the most sensitive store in the suite: read or write it only at the person’s explicit request, and reads omit photo bytes unless {full: true}. No action touches the network — the opt-in photo-describe call (photo → Anthropic, BYOK) runs only from the app’s own attach flow and is deliberately not exposed here. Entries record the person’s own words and ratings; never invent journal content.',
});
</script>
