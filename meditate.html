<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Browser-chrome tint. Without this, iOS Safari samples the page
       background for the toolbar colour — and meditate's html/body uses a
       radial-gradient (no solid layer) it can't sample, so the toolbar
       defaulted to white. Match the deep base so the chrome stays dark. -->
  <meta name="theme-color" content="#05050f">
  <title>Meditate · Hill Climbing</title>
  <!-- ── PWA: installable app shell ───────────────────────────── -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meditate">
  <style>
    :root {
      /* ── Hill Climbing — shared design tokens ─────────────────── */
      --bg-base:   #05050f;       /* meditate runs a touch deeper for immersion */
      --bg-center: #0f0f2a;
      --font-display: 'Georgia', 'Times New Roman', serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --radius-pill: 999px;
      --ease: 0.25s ease;
      /* ── Per-practice accent — Meditate (purple) ──────────────── */
      --accent:      #c8b8ff;
      --accent-soft: rgba(200,184,255,0.5);
      --text:        #e8e0ff;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* iOS Safari adds default button padding/styling that breaks our
       icon-circle layout. Reset universally. Use system font on icon
       buttons so Unicode glyphs render consistently across platforms. */
    button {
      -webkit-appearance: none;
      appearance: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Symbol",
                   system-ui, sans-serif;
      /* explicit padding 0 + tabular line-height; iOS Safari was rendering
         buttons taller than their declared height because of font metrics,
         producing oval bounding boxes. */
      padding: 0;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    /* Force text-style presentation for any glyph that has both text
       and emoji variants. The variation selector U+FE0E is in the markup,
       but explicit CSS belt-and-braces helps Safari. */
    button { font-variant-emoji: text; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(ellipse at center, var(--bg-center) 0%, var(--bg-base) 100%);
      /* iOS Safari tints its toolbar from the body's *computed*
         background-color, not the rendered pixels and not theme-color.
         The gradient shorthand above resets background-color to
         transparent, which Safari can't sample → white toolbar. Restating
         a solid colour here (visually hidden under the opaque gradient)
         gives Safari a colour to read, matching breathe/reflect. */
      background-color: var(--bg-base);
      color: var(--text);
      font-family: var(--font-display);
    }

    #app {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Start screen ── */
    #start-screen {
      display: flex; flex-direction: column;
      align-items: center; gap: 28px; text-align: center;
      animation: fadeIn 1.8s ease;
    }

    /* Landing ring — a static replica of the practice ring at rest, so the
       landing reads as the practice screen paused rather than a title card. */
    #start-ring {
      width: 300px; height: 300px;
      display: flex; align-items: center; justify-content: center;
    }
    #start-ring svg { width: 100%; height: 100%; }

    #start-screen p {
      font-family: var(--font-display); font-style: italic;
      font-size: 1.05rem; color: rgba(200, 184, 255, 0.6);
      letter-spacing: 0.04em; line-height: 1.7;
    }

    /* ── Timed options — the duration row + Begin button. ── */
    #timed-options {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      animation: fadeIn 0.6s ease;
    }
    #timed-options[hidden] { display: none; }
    #timed-pills {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    .timed-pill {
      min-width: 44px; padding: 8px 14px;
      border: 1.5px solid rgba(200, 184, 255, 0.2);
      border-radius: 16px; background: transparent;
      color: var(--accent-soft);
      font-family: var(--font-ui); font-size: 0.85rem; letter-spacing: 0.04em;
      cursor: pointer; transition: border-color 0.2s, color 0.2s;
    }
    .timed-pill:hover { border-color: rgba(200, 184, 255, 0.42); color: var(--text); }
    .timed-pill.sel   { border-color: var(--accent); color: var(--accent); }
    #timed-begin {
      padding: 0 34px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(200, 184, 255, 0.4);
      border-radius: var(--radius-pill); background: transparent;
      color: var(--accent);
      font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase;
      cursor: pointer; transition: all 0.4s ease;
    }
    #timed-begin:hover {
      background: rgba(200, 184, 255, 0.08);
      border-color: rgba(200, 184, 255, 0.65);
      box-shadow: 0 0 40px var(--accent-glow);
    }

    /* ── Meditation screen ── */
    #meditation-screen {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%; height: 100%; position: relative;
      animation: fadeIn 1.2s ease;
    }

    /* ── Ring ── */
    #ring-container {
      position: relative; width: 300px; height: 300px;
      display: flex; align-items: center; justify-content: center;
    }

    #stillness-svg {
      width: 100%; height: 100%;
      transform: rotate(-90deg);
      transition: filter 1s ease;
    }

    .ring-track {
      fill: none;
      stroke: rgba(200, 180, 255, 0.06);
      stroke-width: 3;
    }

    .ring-dots {
      fill: none;
      stroke: rgba(200, 180, 255, 0.07);
      stroke-width: 2;
      stroke-dasharray: 1.5 9;
    }

    #ring-progress {
      fill: none;
      stroke: #9080d0;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke 0.8s ease,
                  filter 0.8s ease;
    }

    #state-text {
      margin-top: 36px; font-size: 0.95rem;
      color: #6858a0; letter-spacing: 0.2em;
      min-height: 24px; transition: opacity 0.6s ease;
      font-style: italic;
    }

    #version-label {
      position: fixed; bottom: 10px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem; color: #2a1a4a;
      letter-spacing: 0.2em;
      padding: 6px 12px;
      user-select: none;
    }

    #action-btn {
      margin-top: 24px;
      width: 64px; height: 64px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(200, 184, 255, 0.35);
      border-radius: 50%; background: transparent;
      color: #c8b8ff; font-family: inherit;
      font-size: 1.2rem;
      cursor: pointer; transition: all 0.4s ease;
      visibility: hidden;
    }
    #action-btn:hover {
      background: rgba(200, 184, 255, 0.1);
      border-color: rgba(200, 184, 255, 0.6);
    }
    #action-btn.show { visibility: visible; }
    #action-btn:disabled {
      cursor: not-allowed; opacity: 0.45;
      color: #6858a0;
    }
    #action-btn:disabled:hover {
      background: transparent;
      border-color: rgba(200, 184, 255, 0.35);
    }

    /* Round timer — displays to the right of the ring during a sit.
       The number on its own (with its monospace tabular-num feel) reads as
       a countdown in context. */
    #round-timer {
      position: absolute;
      left: calc(100% + 28px);
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.4rem;
      font-weight: 300;
      color: #8878b8;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      display: none;
      pointer-events: none;
      opacity: 0.75;
    }
    #round-timer.show { display: block; }

    /* Stop-button styling during a sit (signals neutral end, not failure) */
    #action-btn.stop {
      border-color: rgba(180, 160, 200, 0.25);
      color: #8878aa;
      font-size: 0;            /* hide the ■ glyph — it renders small/inconsistently */
    }
    /* Draw the stop square in CSS for reliable, well-proportioned sizing
       across platforms (the unicode ■ rendered oddly small in the button). */
    #action-btn.stop::before {
      content: '';
      width: 20px; height: 20px;
      background: currentColor;
      border-radius: 4px;
    }
    #action-btn.stop:hover {
      background: rgba(180, 160, 200, 0.06);
      border-color: rgba(180, 160, 200, 0.5);
    }

    /* Home / all-practices link — returns to the hub. Top-left so it stays
       clear of the bottom-anchored practice controls. Dim by default to
       respect the immersive screen; brightens on hover. */
    #home-link {
      position: fixed; top: 20px; left: 20px; z-index: 30;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(200, 184, 255, 0.18);
      color: #6858a0; text-decoration: none;
      cursor: pointer; user-select: none;
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    #home-link:hover { color: var(--accent); border-color: var(--accent-soft); }
    #home-link svg { width: 16px; height: 16px; display: block; }
    @media (max-width: 640px) {
      #home-link { top: 14px; left: 14px; width: 32px; height: 32px; }
    }

    /* Icon-button defensive shape rules. Belt-and-braces against iOS Safari
       rendering bounding boxes as ovals from font metrics. */
    #action-btn, #mute-btn {
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
    }

    /* ── Mute button ── (line-height centring for iOS) */
    #mute-btn {
      position: fixed; bottom: 24px; left: 24px;
      width: 40px; height: 40px;
      min-width: 40px; max-width: 40px;
      min-height: 40px; max-height: 40px;
      display: inline-block;
      text-align: center;
      line-height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(200, 184, 255, 0.2);
      background: transparent; cursor: pointer;
      color: #6858a0; font-size: 18px;
      transition: all 0.3s ease;
    }
    #mute-btn:hover { border-color: rgba(200, 184, 255, 0.5); color: #c8b8ff; }

    @keyframes fadeIn {
      /* Opacity-only fade. Any ancestor with a transform becomes the
         containing block for position:fixed descendants, so a translateY
         here would re-anchor fixed corner elements during the animation. */
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Mobile / narrow-viewport adjustments ──
       Single break at 640px:
       - Ring is slightly smaller
       - Timer moves below the ring instead of beside it
       - State-text constrains to viewport with padding
       - Corner buttons shrink and tighten margins */
    @media (max-width: 640px) {
      #ring-container {
        width: 240px;
        height: 240px;
      }
      #round-timer {
        left: 50%;
        top: calc(100% + 14px);
        transform: translateX(-50%);
        font-size: 1.2rem;
        text-align: center;
      }
      #state-text {
        max-width: 92vw;
        padding: 0 14px;
        font-size: 0.85rem;
        margin-top: 44px; /* clear the timer that now sits below the ring */
      }
      #start-ring {
        width: 240px; height: 240px;
      }
      #start-screen p {
        max-width: 88vw;
        font-size: 0.9rem;
      }
      #mute-btn {
        bottom: 14px; left: 14px;
        width: 34px; height: 34px;
        font-size: 1rem;
      }
      #version-label { font-size: 0.55rem; bottom: 4px; }
    }
  </style>
</head>
<body>

<div id="app">

  <!-- Home / all-practices link → hub -->
  <a id="home-link" href="index.html" title="All practices" aria-label="All practices">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V19h13V9.8"/>
    </svg>
  </a>

  <!-- ── Start Screen ── -->
  <div id="start-screen">
    <div id="start-ring" aria-hidden="true">
      <svg viewBox="0 0 220 220">
        <circle class="ring-dots"  cx="110" cy="110" r="100" />
        <circle class="ring-track" cx="110" cy="110" r="90" />
      </svg>
    </div>
    <p id="start-prompt">Find a comfortable position.</p>
    <!-- Timed sit: pick a length, then Begin. -->
    <div id="timed-options">
      <div id="timed-pills" role="group" aria-label="Session length">
        <button class="timed-pill" data-minutes="5">5</button>
        <button class="timed-pill" data-minutes="10">10</button>
        <button class="timed-pill" data-minutes="20">20</button>
        <button class="timed-pill" data-minutes="30">30</button>
        <button class="timed-pill" data-minutes="45">45</button>
      </div>
      <button id="timed-begin" aria-label="Begin timed sit">Begin</button>
    </div>
  </div>

  <!-- ── Meditation Screen ── -->
  <div id="meditation-screen">
    <div id="ring-container">
      <svg id="stillness-svg" viewBox="0 0 220 220">
        <!-- Outer guide ring (dots) -->
        <circle class="ring-dots" cx="110" cy="110" r="100" />
        <!-- Main track -->
        <circle class="ring-track" cx="110" cy="110" r="90" />
        <!-- Progress ring -->
        <circle id="ring-progress" cx="110" cy="110" r="90" />
      </svg>

      <p id="round-timer">0:00</p>
    </div>

    <p id="state-text">Settle in…</p>
    <button id="action-btn" aria-label="Begin">▶︎</button>

    <button id="mute-btn" title="Toggle sound" aria-label="Toggle sound">♪</button>
    <p id="version-label">v1.80</p>
  </div>

</div>

<!-- ── Cross-device sync engine + status chip (opt-in, E2E-encrypted) ──── -->
<script src="/hc-sync.js"></script>
<script src="/hc-usage.js"></script>
<script src="/hc-sync-chip.js"></script>
<script src="/hc-agent.js"></script>

<script>
// ─────────────────────────────────────────────
// Constants
// ─────────────────────────────────────────────
const RING_R       = 90;
const CIRCUMF      = 2 * Math.PI * RING_R;

const MASTER_VOLUME = 0.65;    // gentler than the default 0.8

// Timed-mode ambient wash. A soft brown-noise bed (ocean/wind-like) that
// plays under the opening and closing bells of a timed sit. Lowpassed so it's
// a gentle hush, not hiss, with a slow gain swell so it breathes like distant
// waves rather than sitting flat.
const TIMED_NOISE_BASE   = 0.05;   // steady level (relative to master)
const TIMED_NOISE_SWELL  = 0.03;   // ± swell depth added by the slow LFO
const TIMED_NOISE_LFO_HZ = 0.07;   // ≈14 s swell period
const TIMED_NOISE_CUTOFF = 520;    // lowpass — soft hush, no high hiss
const TIMED_OPEN_BELL    = 528;    // opening bell pitch (closing uses 220)

// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let audioEngine  = null;
let muted        = false;

// ── Usage logging for the hub dashboard ──────────────────────────────────
// The usage log (per-app day-flags + per-session durations) lives in the shared
// hc-usage.js module, so all apps write one consistent store and it can sync
// across devices. markUsage marks the day active (session start); addUsageDuration
// records the elapsed seconds of a completed sit.
function markUsage(app) { if (window.HCUsage) HCUsage.mark(app); }
function addUsageDuration(app, secs) { if (window.HCUsage) HCUsage.addDuration(app, secs); }
let hcLoggedToday = false; // count one meditation/day; the begin path fires once

// ─────────────────────────────────────────────
// Timed mode — a quiet countdown, no camera
// ─────────────────────────────────────────────
const TIMED_MINUTES_KEY = 'hill-climbing-timed-minutes';
let timedMinutes   = 10;          // selected duration; overwritten on load
let timedStart     = 0;           // performance.now() when the sit began
let timedDurationSecs = 0;
let timedRunning   = false;       // guards the dedicated timed rAF chain
function readStoredTimedMinutes() {
  try {
    const stored = parseInt(localStorage.getItem(TIMED_MINUTES_KEY), 10);
    if (stored > 0) timedMinutes = stored;
  } catch {}
}
readStoredTimedMinutes();

let wakeLock = null;

async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

// Re-acquire after returning to the tab (iOS releases on hide)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && timedRunning) acquireWakeLock();
});

// ─────────────────────────────────────────────
// DOM
// ─────────────────────────────────────────────
const startScreen    = document.getElementById('start-screen');
const meditScreen    = document.getElementById('meditation-screen');
const timedPills     = document.getElementById('timed-pills');
const timedBeginBtn  = document.getElementById('timed-begin');
const ringProgress   = document.getElementById('ring-progress');
const stateText      = document.getElementById('state-text');
const muteBtn        = document.getElementById('mute-btn');
const actionBtn      = document.getElementById('action-btn');
const roundTimer     = document.getElementById('round-timer');

ringProgress.style.strokeDasharray  = CIRCUMF;
ringProgress.style.strokeDashoffset = CIRCUMF;

// ─────────────────────────────────────────────
// Audio Engine — bells + a soft ambient noise bed for the timed sit.
// ─────────────────────────────────────────────
class AudioEngine {
  constructor() {
    this.ctx   = new (window.AudioContext || window.webkitAudioContext)();
    this.muted = false;
    this.roundAudible = false;   // audio sounds only during a sit (set via setRoundAudible)

    // iOS Safari unlock (triple-redundant). iOS 17+ enforces strict gesture
    // rules: AudioContext must be unlocked in the FIRST user gesture (the
    // Begin click), and even then sometimes requires both Web Audio and
    // HTML5 Audio paths to be exercised.
    this.ctx.resume();
    const wbBuf = this.ctx.createBuffer(1, 1, 22050);
    const wbSrc = this.ctx.createBufferSource();
    wbSrc.buffer = wbBuf;
    wbSrc.connect(this.ctx.destination);
    wbSrc.start(0);
    // HTML5 Audio path — a silent WAV played via the standard Audio
    // element sometimes succeeds where Web Audio alone is blocked, and
    // unlocks audio routing through the loudspeaker rather than the
    // receiver speaker (an iOS issue).
    try {
      const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
      a.play().catch(() => {});
    } catch {}

    this._build();
  }

  _build() {
    const ctx = this.ctx;

    this.master = ctx.createGain();
    // Silent until setRoundAudible opens the gate at the start of a sit.
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);

    this.reverb = ctx.createConvolver();
    this.reverb.buffer = this._impulse(3.5);

    this.wet = ctx.createGain(); this.wet.gain.value = 0.45;
    this.dry = ctx.createGain(); this.dry.gain.value = 0.55;
    this.reverb.connect(this.wet);
    this.wet.connect(this.master);
    this.dry.connect(this.master);
  }

  _impulse(duration) {
    const sr = this.ctx.sampleRate, len = Math.floor(sr * duration);
    const buf = this.ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const ch = buf.getChannelData(c);
      for (let i = 0; i < len; i++)
        ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.8);
    }
    return buf;
  }

  triggerBell(freq = 528, vol = 1.0) {
    if (this.muted) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const ctx = this.ctx, t = ctx.currentTime;
    const strike = (f, baseVol, decay) => {
      const osc = ctx.createOscillator(), env = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(baseVol * vol, t + 0.012);
      env.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      osc.connect(env); env.connect(this.reverb); env.connect(this.dry);
      osc.start(t); osc.stop(t + decay);
    };
    strike(freq,        0.30, 3.5);
    strike(freq * 2.76, 0.10, 1.8);
    strike(freq * 5.40, 0.04, 1.0);
  }

  setMuted(m) {
    this.muted = m;
    this._applyGain(0.3);
  }

  // Audio is audible only while a sit is happening — gated by setRoundAudible.
  // Respects the user's mute preference.
  setRoundAudible(on) {
    this.roundAudible = on;
    this._applyGain(on ? 0.7 : 0.4);
  }

  // A soft ambient noise bed under the sit. Brown noise (integrated white —
  // low, rounded rumble) looped through a lowpass, with a slow LFO swelling
  // the level so it breathes like distant waves. Routes through dry+reverb →
  // master, so mute and the round gate still apply.
  startAmbientNoise() {
    if (this.noiseGain) return; // already running
    const ctx = this.ctx, t = ctx.currentTime;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < data.length; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;  // brown integration
      data[i] = last * 3.2;                 // makeup gain to ~unity
    }
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = TIMED_NOISE_CUTOFF; filter.Q.value = 0.5;
    const gain = ctx.createGain();
    // Slow swell summed onto the level so the bed rises and falls gently.
    const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
    lfo.frequency.value = TIMED_NOISE_LFO_HZ; lfoGain.gain.value = TIMED_NOISE_SWELL;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    src.connect(filter); filter.connect(gain);
    gain.connect(this.dry); gain.connect(this.reverb);
    gain.gain.setValueAtTime(0, t);                                  // fade in
    gain.gain.linearRampToValueAtTime(TIMED_NOISE_BASE, t + 2.5);
    src.start(t); lfo.start(t);
    this.noiseSrc = src; this.noiseLfo = lfo; this.noiseGain = gain; this.noiseLfoGain = lfoGain;
  }

  stopAmbientNoise() {
    if (!this.noiseGain) return;
    const t = this.ctx.currentTime;
    this.noiseGain.gain.cancelScheduledValues(t);
    this.noiseGain.gain.setValueAtTime(TIMED_NOISE_BASE, t);
    this.noiseGain.gain.linearRampToValueAtTime(0, t + 1.5);         // fade out
    this.noiseLfoGain.gain.setTargetAtTime(0, t, 0.4);               // stop the swell
    const src = this.noiseSrc, lfo = this.noiseLfo;
    try { src.stop(t + 2); } catch {}
    try { lfo.stop(t + 2); } catch {}
    this.noiseSrc = null; this.noiseLfo = null; this.noiseGain = null; this.noiseLfoGain = null;
  }

  // Single source of truth for the master gain: audible only when in a sit
  // and not muted. Mute and the sit start/end all route here.
  _applyGain(tau = 0.4) {
    const target = (this.muted || !this.roundAudible) ? 0 : MASTER_VOLUME;
    this.master.gain.setTargetAtTime(target, this.ctx.currentTime, tau);
  }
}

// ─────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────
function fmtSecs(s) {
  const sec = Math.max(0, Math.ceil(s));
  return sec >= 60 ? `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}` : `${sec}s`;
}

// ─────────────────────────────────────────────
// Timed mode — a quiet countdown, no camera
// ─────────────────────────────────────────────
// "Begin" starts a dedicated rAF loop that fills the ring as time elapses,
// with a soft ambient noise bed and bells at the open and close. A single
// closing bell ends the sit. No win/loss is recorded.

// Reflect the saved/default duration as the selected pill.
function syncTimedPills() {
  timedPills.querySelectorAll('.timed-pill').forEach(p => {
    p.classList.toggle('sel', parseInt(p.dataset.minutes, 10) === timedMinutes);
  });
}
syncTimedPills();

function setTimedMinutes(n) {
  if (![5, 10, 20, 30, 45].includes(n)) return; // the only lengths the pills offer
  timedMinutes = n;
  try { localStorage.setItem(TIMED_MINUTES_KEY, String(timedMinutes)); } catch {}
  syncTimedPills();
}

timedPills.addEventListener('click', e => {
  const pill = e.target.closest('.timed-pill');
  if (!pill) return;
  setTimedMinutes(parseInt(pill.dataset.minutes, 10));
});

// Tear down a timed sit cleanly: stop the loop, fade audio via the
// existing gain path, release the wake lock, return to the start screen.
function endTimedSit(message) {
  timedRunning = false;
  // Log the actual time sat — whether the ring filled or the user ended early;
  // either way that's real practice. timedStart is zeroed so any second call
  // for the same sit can't double-count.
  if (timedStart > 0) { addUsageDuration('meditate', (performance.now() - timedStart) / 1000); timedStart = 0; }
  roundTimer.classList.remove('show');
  if (audioEngine) { audioEngine.stopAmbientNoise(); audioEngine.setRoundAudible(false); } // fade out
  releaseWakeLock();
  if (message) stateText.textContent = message;
  // Return to the start screen so the user can sit again.
  meditScreen.style.display = 'none';
  startScreen.style.display = 'flex';
}

function timedLoop() {
  if (!timedRunning) return;
  try {
    const now = performance.now();
    const elapsed = (now - timedStart) / 1000;

    if (elapsed >= timedDurationSecs) {
      // Completion — fill the ring, ring a single calming closing bell,
      // and return to a restartable state. 220 Hz reads as a gentle close.
      ringProgress.style.strokeDashoffset = 0;
      if (audioEngine) audioEngine.triggerBell(220, 0.8);
      endTimedSit('The sit is complete. Rest a moment.');
      return;
    }

    // Ring fills empty → full as time elapses.
    const progress = Math.max(0, Math.min(1, elapsed / timedDurationSecs));
    ringProgress.style.strokeDashoffset = CIRCUMF * (1 - progress);

    // Countdown timer.
    roundTimer.textContent = fmtSecs(Math.ceil(timedDurationSecs - elapsed));

    // No bells mid-sit: the bell sounds only at the open and the close.
    // The continuous element is the ambient noise bed, started in beginTimedSit.

    requestAnimationFrame(timedLoop);
  } catch (err) {
    // Keep the safety net alive: log, end the sit gracefully.
    console.error('timed loop error', err);
    endTimedSit('Something interrupted the sit. You can begin again.');
  }
}

function beginTimedSit() {
  // iOS audio unlock on this gesture. No camera.
  if (!audioEngine) audioEngine = new AudioEngine();
  audioEngine.ctx.resume();

  // Swap screens.
  startScreen.style.display = 'none';
  meditScreen.style.display = 'flex';

  // Bells + noise route through master gain (→ reverb/dry → master), gated by
  // setRoundAudible. Open the gate so they're audible, then start the ambient
  // noise bed and ring a single opening bell.
  if (audioEngine) {
    audioEngine.setRoundAudible(true);
    audioEngine.startAmbientNoise();
    audioEngine.triggerBell(TIMED_OPEN_BELL, 0.8);
  }

  // Usage log — one meditation/day.
  if (!hcLoggedToday) { markUsage('meditate'); hcLoggedToday = true; }

  acquireWakeLock();

  // Calm orientation copy + visible countdown.
  stateText.textContent = 'Rest. A bell opens and closes the sit.';
  actionBtn.textContent = '■';
  actionBtn.classList.add('stop', 'show');
  actionBtn.disabled = false;
  roundTimer.classList.add('show');

  // Start the dedicated loop.
  timedDurationSecs = timedMinutes * 60;
  timedStart = performance.now();
  ringProgress.style.strokeDashoffset = CIRCUMF; // empty
  roundTimer.textContent = fmtSecs(timedDurationSecs);
  timedRunning = true;
  requestAnimationFrame(timedLoop);
}

timedBeginBtn.addEventListener('click', beginTimedSit);

// The ■ stop button ends the sit cleanly (no win/loss).
actionBtn.addEventListener('click', () => {
  if (timedRunning) endTimedSit('Ended. Rest a moment.');
});

// Esc ends a running sit.
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && timedRunning) endTimedSit('Ended. Rest a moment.');
});

// ─────────────────────────────────────────────
// Mute toggle
// ─────────────────────────────────────────────
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '♪̶' : '♪';
  muteBtn.style.color = muted ? '#3a2a52' : '';
  if (audioEngine) audioEngine.setMuted(muted);
});

// Version label.
document.getElementById('version-label').textContent = 'v1.80';

    },
  ],

      params: { minutes: 'number — one of 5|10|20|30|45, required' },

    },

      params: {},

      params: {},
