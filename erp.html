<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0b12">
  <title>ERP · Hill Climbing</title>
  <!-- ── PWA: installable app shell ───────────────────────────── -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ERP">
  <style>
    :root {
      /* ── Hill Climbing — shared design tokens ─────────────────── */
      --bg-base: #0a0b12;
      --panel:   rgba(255,255,255,0.04);
      --line:    rgba(255,255,255,0.10);
      --line-strong: rgba(255,255,255,0.20);
      --text:  rgba(255,255,255,0.86);
      --mid:   rgba(255,255,255,0.55);
      --dim:   rgba(255,255,255,0.34);
      --faint: rgba(255,255,255,0.16);
      --font-display: Georgia, 'Times New Roman', serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --radius-pill: 999px;
      --ease: 0.25s ease;
      /* ── Per-practice accent — ERP (grounded forest green) ────────
         Fills the large open arc between Reflect (amber 38°) and
         Nourish (mint 150°); a deeper, cooler, more desaturated green
         than Nourish's — reads as steadiness / staying-with, apt for
         facing fear without flinching. */
      --accent:      hsl(120,30%,56%);
      --accent-soft: hsla(120,28%,54%,0.45);
      --accent-glow: hsla(120,34%,42%,0.16);
      --bg: var(--bg-base);        /* legacy alias */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg-base); color: var(--text); }
    body {
      font-family: var(--font-ui);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      padding: 64px 20px 96px;
      background:
        radial-gradient(ellipse 120% 48% at 50% -6%, var(--accent-glow), transparent 60%) fixed,
        var(--bg-base);
    }

    /* ── top bar ────────────────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 10;
      background: linear-gradient(var(--bg) 55%, rgba(12,14,20,0));
      pointer-events: none;
    }
    .corner {
      position: fixed; top: 16px; font-size: 11px; color: var(--dim);
      letter-spacing: 0.06em; z-index: 11;
    }
    #version-label { top: 22px; left: 62px; }

    /* Home / all-practices link — returns to the hub. */
    #home-link {
      position: fixed; top: 11px; left: 18px; z-index: 12;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--dim); text-decoration: none;
      cursor: pointer; user-select: none;
      transition: color 0.2s, border-color 0.2s;
    }
    #home-link:hover { color: var(--accent); border-color: var(--accent-soft); }
    #home-link svg { width: 16px; height: 16px; display: block; }

    /* Corner menu — the shared data-management dropdown. */
    #menu { position: fixed; top: 11px; right: 18px; z-index: 12; }
    #menu-btn {
      width: 34px; height: 34px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 999px; border: 1px solid rgba(255,255,255,0.12);
      color: var(--dim); background: transparent; cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    #menu-btn:hover, #menu.open #menu-btn { color: var(--accent); border-color: var(--accent-soft); }
    #menu-btn svg { width: 16px; height: 16px; display: block; }
    #menu-panel {
      position: absolute; top: 42px; right: 0; width: 240px;
      background: rgba(20,20,34,0.97); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 8px; animation: fadeUp 0.18s ease;
    }
    #menu-panel.hidden { display: none; }
    .menu-head {
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim); padding: 8px 10px 6px;
    }
    .menu-item {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      width: 100%; text-align: left; padding: 9px 10px; border: none; border-radius: 8px;
      background: transparent; color: var(--text); cursor: pointer;
      font-family: var(--font-ui); transition: background 0.15s; text-decoration: none;
    }
    .menu-item:hover { background: rgba(255,255,255,0.06); }
    .menu-item-title { font-size: 14px; letter-spacing: 0.02em; }
    .menu-item-sub { font-size: 11px; color: var(--dim); }
    .menu-item.danger .menu-item-title { color: hsl(8,62%,62%); }
    .menu-note { font-size: 10.5px; color: var(--faint); padding: 8px 10px 4px; line-height: 1.5; }

    /* Sync section + status dot on the menu button. */
    #sync-dot {
      position: absolute; top: 6px; right: 6px; width: 8px; height: 8px;
      border-radius: 999px; background: var(--faint); pointer-events: none;
      display: none; transition: background 0.3s;
    }
    #sync-dot.on   { display: block; }
    #sync-dot.ok   { background: hsl(150,48%,55%); }
    #sync-dot.warn { background: hsl(38,80%,60%); }
    #sync-dot.err  { background: hsl(8,62%,62%); }
    #sync-dot.busy { background: var(--accent); }
    .sync-status { font-size: 11px; color: var(--dim); padding: 2px 10px 8px; line-height: 1.5; }

    /* ── mode nav ───────────────────────────────────────────────── */
    #mode-nav {
      position: fixed; top: 11px; left: 50%; transform: translateX(-50%); z-index: 11;
      display: flex; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 3px; gap: 2px;
    }
    .mode-btn {
      padding: 5px 15px; border-radius: 14px; border: none; background: transparent;
      color: var(--dim); font-size: 11px; letter-spacing: 0.08em; cursor: pointer;
      transition: background 0.2s, color 0.2s; font-family: var(--font-ui);
    }
    .mode-btn.active { background: rgba(255,255,255,0.1); color: var(--text); }

    main { max-width: 620px; margin: 0 auto; }
    .lede { color: var(--mid); font-size: 13.5px; line-height: 1.6; margin: 4px 2px 20px; }

    /* ── ladder items ───────────────────────────────────────────── */
    .items { display: flex; flex-direction: column; gap: 10px; }
    .item {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; animation: fadeUp 0.3s ease;
    }
    .item.is-resting { opacity: 0.55; }
    .item-head { display: flex; align-items: center; gap: 11px; cursor: pointer; }
    .chip {
      flex: none; min-width: 34px; height: 26px; padding: 0 8px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 8px; font-size: 13px; font-variant-numeric: tabular-nums;
      color: var(--accent); background: var(--accent-glow);
      border: 1px solid var(--accent-soft);
    }
    .item-title { flex: 1; font-size: 15px; color: var(--text); line-height: 1.35; }
    .item-meta { flex: none; font-size: 11px; color: var(--dim); letter-spacing: 0.04em; }
    .item-detail { margin: 12px 2px 4px; display: flex; flex-direction: column; gap: 9px; }
    .df { display: flex; flex-direction: column; gap: 2px; }
    .df-l { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
    .df-v { font-size: 13.5px; color: var(--mid); white-space: pre-wrap; }
    .none { font-size: 12.5px; color: var(--dim); font-style: italic; }
    .hist { margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
    .hist-row {
      display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; color: var(--mid);
      padding: 6px 0; border-top: 1px solid var(--faint);
    }
    .hist-date { flex: none; color: var(--dim); font-size: 11px; min-width: 74px; }
    .hist-suds { flex: none; font-variant-numeric: tabular-nums; color: var(--text); }
    .hist-res { flex: 1; color: var(--dim); font-size: 11.5px; }
    .item-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

    .btn {
      padding: 7px 13px; border-radius: 9px; border: 1px solid var(--line);
      background: transparent; color: var(--mid); font-size: 12.5px; cursor: pointer;
      font-family: var(--font-ui); transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .btn:hover { color: var(--text); border-color: var(--line-strong); }
    .btn.primary { color: var(--bg-base); background: var(--accent); border-color: var(--accent); font-weight: 600; }
    .btn.primary:hover { filter: brightness(1.08); color: var(--bg-base); }
    .btn.danger { color: hsl(8,60%,62%); border-color: transparent; }
    .btn.danger:hover { border-color: hsla(8,60%,62%,0.4); }
    .add-btn {
      width: 100%; margin-top: 14px; padding: 12px; border-radius: 12px;
      border: 1px dashed var(--line-strong); background: transparent; color: var(--mid);
      font-size: 13px; cursor: pointer; font-family: var(--font-ui); transition: color 0.15s, border-color 0.15s;
    }
    .add-btn:hover { color: var(--accent); border-color: var(--accent-soft); }
    .rest-head { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); margin: 22px 2px 10px; }
    .linklike { background: none; border: none; color: var(--accent); cursor: pointer; font-family: var(--font-ui); font-size: 12.5px; padding: 0; }
    .linklike:hover { text-decoration: underline; }
    .ladder-foot { text-align: center; margin-top: 22px; }

    .empty {
      text-align: center; color: var(--mid); font-size: 14px; padding: 30px 8px; line-height: 1.7;
      max-width: 480px; margin: 0 auto;
    }
    .empty p { margin-bottom: 14px; }
    .empty .tiny { font-size: 12px; }

    /* ── progress cards ─────────────────────────────────────────── */
    .pcard {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 12px; animation: fadeUp 0.3s ease;
    }
    .pcard-head { display: flex; align-items: center; gap: 11px; margin-bottom: 10px; }
    .pcard-title { flex: 1; font-size: 15px; }
    .spark { display: block; margin: 6px 0 4px; overflow: visible; }
    .spark .grid { stroke: var(--faint); stroke-width: 1; }
    .spark polyline { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .spark polyline.peak { stroke: var(--accent); }
    .spark polyline.end  { stroke: var(--dim); stroke-dasharray: 3 3; }
    .spark circle.peak { fill: var(--accent); }
    .spark circle.end  { fill: var(--dim); }
    .legend { display: flex; gap: 16px; font-size: 11px; color: var(--dim); margin: 6px 0 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 14px; height: 0; border-top: 2px solid var(--accent); }
    .swatch.end { border-top: 2px dashed var(--dim); }
    .mirror { font-size: 13px; color: var(--mid); line-height: 1.6; }
    .mirror b { color: var(--text); font-weight: 600; }
    .refl { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--faint); padding-top: 12px; }
    .rf { display: flex; flex-direction: column; gap: 2px; }
    .rf-l { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
    .rf-v { font-size: 13px; color: var(--mid); white-space: pre-wrap; }

    /* ── guide ──────────────────────────────────────────────────── */
    .guide { color: var(--mid); font-size: 14px; line-height: 1.7; }
    .guide h3 { color: var(--text); font-size: 15px; font-weight: 600; margin: 26px 0 8px; letter-spacing: 0.01em; }
    .guide h3:first-child { margin-top: 4px; }
    .guide p { margin-bottom: 12px; }
    .guide b { color: var(--text); font-weight: 600; }
    .guide a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
    .guide a:hover { filter: brightness(1.1); }
    .guide .care { border-left: 2px solid var(--accent-soft); padding: 2px 0 2px 14px; margin: 16px 0; }

    /* ── sheet (add / edit / log) ───────────────────────────────── */
    #sheet-overlay {
      position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start;
      justify-content: center; padding: 40px 16px 40px; overflow-y: auto;
      background: rgba(6,7,12,0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    #sheet-overlay.hidden { display: none; }
    #sheet {
      width: 100%; max-width: 460px; background: rgba(20,20,32,0.98);
      border: 1px solid var(--line); border-radius: 16px; padding: 20px 20px 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55); animation: fadeUp 0.2s ease;
    }
    .sheet-h { font-size: 16px; color: var(--text); font-weight: 600; }
    .sheet-sub { font-size: 13px; color: var(--accent); margin: 3px 0 4px; }
    .fld { display: block; margin-top: 15px; }
    .fld.inline { display: flex; align-items: center; gap: 12px; }
    .fld-label { display: block; font-size: 12.5px; color: var(--mid); margin-bottom: 6px; }
    .fld.inline .fld-label { margin-bottom: 0; }
    .opt { color: var(--dim); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; margin-left: 4px; }
    .fld input[type=text], .fld textarea, .fld input[type=number] {
      width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--line);
      border-radius: 9px; padding: 9px 11px; color: var(--text); font-size: 14px;
      font-family: var(--font-ui); resize: vertical;
    }
    .fld input:focus, .fld textarea:focus { outline: none; border-color: var(--accent-soft); }
    .fld input.mins { width: 84px; }
    ::placeholder { color: var(--dim); }

    /* SUDS slider */
    .suds-val { color: var(--accent); font-variant-numeric: tabular-nums; margin-left: 8px; font-size: 14px; }
    input[type=range].suds { width: 100%; -webkit-appearance: none; appearance: none; height: 22px; background: transparent; cursor: pointer; }
    input[type=range].suds::-webkit-slider-runnable-track { height: 5px; border-radius: 999px; background: var(--line-strong); }
    input[type=range].suds::-moz-range-track { height: 5px; border-radius: 999px; background: var(--line-strong); }
    input[type=range].suds::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; margin-top: -8px; width: 20px; height: 20px; border-radius: 999px; background: var(--accent); border: 3px solid var(--bg-base); }
    input[type=range].suds::-moz-range-thumb { width: 17px; height: 17px; border-radius: 999px; background: var(--accent); border: 3px solid var(--bg-base); }
    .suds-anchors { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); margin-top: 2px; letter-spacing: 0.04em; }

    /* choice buttons */
    .choice { display: flex; gap: 6px; }
    .ch {
      flex: 1; padding: 9px 6px; border-radius: 9px; border: 1px solid var(--line);
      background: transparent; color: var(--mid); font-size: 12.5px; cursor: pointer; font-family: var(--font-ui);
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .ch:hover { color: var(--text); }
    .ch.sel { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-glow); }
    .sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    /* ── toast ──────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%) translateY(10px);
      z-index: 60; background: rgba(30,32,44,0.98); border: 1px solid var(--line);
      color: var(--text); font-size: 13px; padding: 9px 16px; border-radius: 999px;
      opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── crisis footer (always present) ─────────────────────────── */
    #crisis {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 9;
      text-align: center; font-size: 11px; color: var(--faint);
      padding: 10px 16px 12px;
      background: linear-gradient(rgba(10,11,18,0) 0%, var(--bg-base) 55%);
      pointer-events: none;
    }
    #crisis a { color: var(--dim); pointer-events: auto; text-decoration: none; border-bottom: 1px solid var(--faint); }
    #crisis a:hover { color: var(--accent); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      #toast { transition: opacity 0.2s; }
    }
    /* On a narrow phone the corner version label collides with the centred nav. */
    @media (max-width: 560px) {
      #version-label { display: none; }
      .mode-btn { padding: 5px 12px; }
    }
  </style>
</head>
<body>

<div class="topbar"></div>
<a id="home-link" href="index.html" title="All practices" aria-label="All practices">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V19h13V9.8"/>
  </svg>
</a>
<div class="corner" id="version-label">v0.1 · erp</div>
<nav id="mode-nav">
  <button class="mode-btn active" data-view="ladder">Ladder</button>
  <button class="mode-btn"        data-view="progress">Progress</button>
  <button class="mode-btn"        data-view="guide">Guide</button>
</nav>
<div id="menu">
  <span id="sync-dot" aria-hidden="true"></span>
  <button id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>
    </svg>
  </button>
  <div id="menu-panel" class="hidden" role="menu">
    <div class="menu-head">Your data</div>
    <button class="menu-item" id="export-btn" type="button" role="menuitem">
      <span class="menu-item-title">Export</span>
      <span class="menu-item-sub">Download your ladder + full record</span>
    </button>
    <button class="menu-item" id="import-btn" type="button" role="menuitem">
      <span class="menu-item-title">Import</span>
      <span class="menu-item-sub">Restore from a backup file</span>
    </button>
    <button class="menu-item danger" id="erase-btn" type="button" role="menuitem">
      <span class="menu-item-title">Delete everything</span>
      <span class="menu-item-sub" id="erase-sub">Your ladder and record, gone for real</span>
    </button>
    <div class="menu-head">Sync</div>
    <div id="sync-status" class="sync-status">This device only</div>
    <a class="menu-item" id="sync-manage" href="index.html#account" role="menuitem">
      <span class="menu-item-title">Manage sync</span>
      <span class="menu-item-sub" id="sync-manage-sub">Sign in at the hub</span>
    </a>
    <div class="menu-note" id="sync-note">Your plan and record live only on this device.</div>
  </div>
  <input type="file" id="import-file" accept="application/json" class="hidden" style="display:none">
</div>

<main id="app-main"></main>

<div id="sheet-overlay" class="hidden"><div id="sheet" role="dialog" aria-modal="true"><div id="sheet-body"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="crisis">
  Not for emergencies. In crisis right now? Call or text <a href="tel:988">988</a> (US) or your local emergency line.
</div>

<script src="/hc-sync.js"></script>
<script src="/hc-usage.js"></script>
<script>
'use strict';
// ── ERP — a companion to Exposure and Response Prevention ───────────────────
// Plan an exposure ladder; log each exposure and what you learned; watch the
// record over time. Companion to therapist-guided ERP, NOT a replacement.
// All on-device by default; opt-in E2EE sync via hc-sync.js. Anti-gamification
// is deliberate (CONSTRAINTS §5): no points, levels, badges, streaks, or "win"
// framing — distress is never a score to maximise, and lower numbers are not
// the goal (see the Guide + KNOWN_RISKS).

const VERSION = 'v0.1 · erp';
const STATE_KEY = 'hill-climbing-erp';
const SYNC_BLOB_KEY = 'ls:hill-climbing-erp';
const SUPABASE_URL = 'https://eztapprkcnwoebnfdebb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_x4iSO5FsdsHutEkYf764Uw_iQeGWMR7';

// ── helpers ─────────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function now() { return Date.now(); }
function clampSUDS(v) { v = Number(v); if (!isFinite(v)) return 0; return Math.max(0, Math.min(100, Math.round(v))); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function byAnticipated(a, b) { return (a.anticipated - b.anticipated) || (a.created - b.created); }
function sessionsFor(id) { return state.sessions.filter(function (s) { return s.itemId === id; }).sort(function (a, b) { return a.ts - b.ts; }); }
const RESISTED_LABEL = { full: 'held the response', partial: 'mostly held', none: 'did the ritual this time' };

// ── state ───────────────────────────────────────────────────────────────────
let state = { v: 1, items: {}, sessions: [] };
let ui = { view: 'ladder', confirmKey: null, expanded: new Set() };

function normalize(raw) {
  const s = { v: 1, items: {}, sessions: [] };
  if (raw && typeof raw === 'object') {
    if (raw.items && typeof raw.items === 'object') {
      Object.keys(raw.items).forEach(function (id) {
        const it = raw.items[id];
        if (!it || typeof it !== 'object') return;
        s.items[id] = {
          id: id,
          title: String(it.title || '').slice(0, 200),
          situation: String(it.situation || '').slice(0, 2000),
          obsession: String(it.obsession || '').slice(0, 2000),
          ritual: String(it.ritual || '').slice(0, 2000),
          anticipated: clampSUDS(it.anticipated),
          status: it.status === 'resting' ? 'resting' : 'active',
          order: Number(it.order) || 0,
          created: Number(it.created) || now(),
          updated: Number(it.updated) || Number(it.created) || now(),
        };
      });
    }
    if (Array.isArray(raw.sessions)) {
      raw.sessions.forEach(function (se) {
        if (!se || typeof se !== 'object' || !se.id) return;
        s.sessions.push({
          id: String(se.id),
          itemId: String(se.itemId || ''),
          ts: Number(se.ts) || Number(se.created) || now(),
          preSUDS: se.preSUDS == null ? null : clampSUDS(se.preSUDS),
          peakSUDS: se.peakSUDS == null ? null : clampSUDS(se.peakSUDS),
          endSUDS: se.endSUDS == null ? null : clampSUDS(se.endSUDS),
          resisted: (se.resisted === 'full' || se.resisted === 'partial' || se.resisted === 'none') ? se.resisted : null,
          expected: String(se.expected || '').slice(0, 2000),
          happened: String(se.happened || '').slice(0, 2000),
          note: String(se.note || '').slice(0, 2000),
          minutes: se.minutes == null ? null : (Number(se.minutes) || null),
          created: Number(se.created) || now(),
        });
      });
    }
  }
  return s;
}

function load() {
  try { state = normalize(JSON.parse(localStorage.getItem(STATE_KEY) || '{}')); }
  catch (e) { state = { v: 1, items: {}, sessions: [] }; }
}
function save() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) { /* quota */ }
  if (window.HCSync && HCSync.queueBlobPush) HCSync.queueBlobPush(SYNC_BLOB_KEY);
}

// ── ladder view ─────────────────────────────────────────────────────────────
function itemDetail(it) {
  const sess = sessionsFor(it.id);
  let h = '<div class="item-detail">';
  if (it.situation) h += '<div class="df"><span class="df-l">Situation</span><span class="df-v">' + esc(it.situation) + '</span></div>';
  if (it.obsession) h += '<div class="df"><span class="df-l">The fear underneath</span><span class="df-v">' + esc(it.obsession) + '</span></div>';
  if (it.ritual) h += '<div class="df"><span class="df-l">What you hold off</span><span class="df-v">' + esc(it.ritual) + '</span></div>';
  if (sess.length) {
    h += '<div class="hist">';
    sess.slice(-5).reverse().forEach(function (s) {
      const range = (s.peakSUDS != null ? s.peakSUDS : '–') + ' → ' + (s.endSUDS != null ? s.endSUDS : '–');
      h += '<div class="hist-row"><span class="hist-date">' + fmtDate(s.ts) + '</span>' +
        '<span class="hist-suds">' + range + '</span>' +
        '<span class="hist-res">' + (s.resisted ? esc(RESISTED_LABEL[s.resisted]) : '') + '</span></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="none">No exposures logged yet.</div>';
  }
  return h + '</div>';
}

function itemCard(it) {
  const sess = sessionsFor(it.id);
  const n = sess.length;
  const expanded = ui.expanded.has(it.id);
  const confirming = ui.confirmKey === 'del:' + it.id;
  return '<div class="item ' + (it.status === 'resting' ? 'is-resting' : '') + '">' +
    '<div class="item-head" data-act="toggle-detail" data-id="' + it.id + '">' +
      '<span class="chip" title="Distress you expect">' + it.anticipated + '</span>' +
      '<span class="item-title">' + esc(it.title) + '</span>' +
      '<span class="item-meta">' + (n ? n + ' logged' : 'not yet') + '</span>' +
    '</div>' +
    (expanded ? itemDetail(it) : '') +
    '<div class="item-actions">' +
      '<button class="btn primary" data-act="log" data-id="' + it.id + '">Log an exposure</button>' +
      '<button class="btn" data-act="edit-item" data-id="' + it.id + '">Edit</button>' +
      '<button class="btn" data-act="rest-item" data-id="' + it.id + '">' + (it.status === 'resting' ? 'Reactivate' : 'Rest') + '</button>' +
      '<button class="btn danger" data-act="del-item" data-id="' + it.id + '">' + (confirming ? 'Tap to confirm' : 'Delete') + '</button>' +
    '</div>' +
  '</div>';
}

function emptyLadder() {
  return '<div class="empty">' +
    '<p>This is a place to hold an <b>exposure ladder</b> — the situations you’re working to face, and a record of facing them.</p>' +
    '<p>It’s a companion to ERP, the frontline therapy for OCD and many anxieties. It works best alongside a therapist trained in ERP, who can help you decide what to face and in what order.</p>' +
    '<p><button class="btn primary" data-act="add-item">Add your first step</button></p>' +
    '<p class="tiny"><button class="linklike" data-act="goto" data-view="guide">New to ERP? Read the short guide first &rarr;</button></p>' +
  '</div>';
}

function renderLadder() {
  const items = Object.keys(state.items).map(function (k) { return state.items[k]; });
  const active = items.filter(function (i) { return i.status !== 'resting'; }).sort(byAnticipated);
  const resting = items.filter(function (i) { return i.status === 'resting'; }).sort(byAnticipated);
  let h = '<div class="lede">Your ladder — the situations you’re working to face, gentlest at the top. Go at your own pace; repeat a step as many times as you need. There’s no finish line.</div>';
  if (!items.length) return h + emptyLadder();
  h += '<div class="items">' + active.map(itemCard).join('') + '</div>';
  if (resting.length) h += '<div class="rest-head">Resting</div><div class="items">' + resting.map(itemCard).join('') + '</div>';
  h += '<button class="add-btn" data-act="add-item">+ Add a step</button>';
  h += '<div class="ladder-foot"><button class="linklike" data-act="goto" data-view="guide">How this works &rarr;</button></div>';
  return h;
}

// ── progress view ───────────────────────────────────────────────────────────
function sparkline(sess) {
  const w = 280, h = 60, pad = 8;
  function pts(key) {
    const arr = [];
    sess.forEach(function (s, i) {
      if (s[key] == null) return;
      const x = sess.length <= 1 ? w / 2 : pad + i * (w - 2 * pad) / (sess.length - 1);
      const y = h - pad - (s[key] / 100) * (h - 2 * pad);
      arr.push([x, y]);
    });
    return arr;
  }
  function draw(arr, cls) {
    if (!arr.length) return '';
    const poly = '<polyline class="' + cls + '" points="' + arr.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>';
    const dots = arr.map(function (p) { return '<circle class="' + cls + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.5"/>'; }).join('');
    return poly + dots;
  }
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto" aria-hidden="true">' +
    '<line class="grid" x1="' + pad + '" y1="' + (h - pad) + '" x2="' + (w - pad) + '" y2="' + (h - pad) + '"/>' +
    '<line class="grid" x1="' + pad + '" y1="' + pad + '" x2="' + (w - pad) + '" y2="' + pad + '"/>' +
    draw(pts('peakSUDS'), 'peak') + draw(pts('endSUDS'), 'end') +
  '</svg>';
}

function progressCard(it, sess) {
  const n = sess.length;
  const withPeak = sess.filter(function (s) { return s.peakSUDS != null; });
  const spanDays = Math.max(1, Math.round((sess[n - 1].ts - sess[0].ts) / 86400000) + 1);
  const held = sess.filter(function (s) { return s.resisted === 'full'; }).length;
  const partial = sess.filter(function (s) { return s.resisted === 'partial'; }).length;
  const last = sess[n - 1];

  let mirror = '<b>' + n + '</b> exposure' + (n > 1 ? 's' : '') + ' over ' + spanDays + ' day' + (spanDays > 1 ? 's' : '') + '.';
  if (withPeak.length >= 2) mirror += ' Peak distress: ' + withPeak[0].peakSUDS + ' &rarr; ' + withPeak[withPeak.length - 1].peakSUDS + '.';
  else if (withPeak.length === 1) mirror += ' Peak distress: ' + withPeak[0].peakSUDS + '.';
  let resLine = ' You held the response ' + held + ' of ' + n + (partial ? ', partly ' + partial : '') + '.';

  let refl = '';
  if (last.expected || last.happened || last.note) {
    refl = '<div class="refl">';
    if (last.expected) refl += '<div class="rf"><span class="rf-l">Expected</span><span class="rf-v">' + esc(last.expected) + '</span></div>';
    if (last.happened) refl += '<div class="rf"><span class="rf-l">Happened</span><span class="rf-v">' + esc(last.happened) + '</span></div>';
    if (last.note) refl += '<div class="rf"><span class="rf-l">Noted</span><span class="rf-v">' + esc(last.note) + '</span></div>';
    refl += '</div>';
  }

  return '<div class="pcard">' +
    '<div class="pcard-head"><span class="chip">' + it.anticipated + '</span><span class="pcard-title">' + esc(it.title) + '</span></div>' +
    sparkline(sess) +
    '<div class="legend"><span><span class="swatch"></span>peak</span><span><span class="swatch end"></span>at end</span></div>' +
    '<div class="mirror">' + mirror + resLine + '</div>' +
    refl +
  '</div>';
}

function renderProgress() {
  const items = Object.keys(state.items).map(function (k) { return state.items[k]; }).sort(byAnticipated);
  const withS = items.map(function (it) { return { it: it, sess: sessionsFor(it.id) }; }).filter(function (x) { return x.sess.length; });
  if (!withS.length) {
    return '<div class="lede">Progress</div><div class="empty">' +
      '<p>Once you’ve logged a few exposures, this is where you’ll see how they’ve gone — distress across repetitions, and what you expected against what actually happened.</p>' +
      '<p>The point isn’t a falling number. It’s the record that you faced it, and what you learned each time.</p>' +
      '<p><button class="btn primary" data-act="goto" data-view="ladder">Go to your ladder</button></p>' +
    '</div>';
  }
  let h = '<div class="lede">How it’s gone — a mirror, not a score. Lower distress is welcome, but the real work is learning you can stay with it and not do the ritual.</div>';
  h += withS.map(function (x) { return progressCard(x.it, x.sess); }).join('');
  return h;
}

// ── guide view ──────────────────────────────────────────────────────────────
function renderGuide() {
  return '<div class="guide">' +
    '<h3>What this is</h3>' +
    '<p>A place to hold your exposure plan and your record of doing it. It’s a <b>companion to ERP</b> — exposure and response prevention, the frontline treatment for OCD and many anxiety problems — not a replacement for it. It works best alongside a therapist trained in ERP, who can help you judge what to face, in what order, and whether a fear is an OCD fear or a real risk.</p>' +

    '<h3>The loop ERP works on</h3>' +
    '<p>OCD runs a loop: an intrusive thought or image shows up (the <b>obsession</b>), it spikes anxiety, and you do something to bring the anxiety down (the <b>compulsion</b> — washing, checking, seeking reassurance, avoiding, a mental ritual). The relief is real but brief, and completing the loop quietly teaches your brain the compulsion was necessary — so the obsession returns, often louder.</p>' +
    '<p>ERP interrupts the loop: you let yourself meet the trigger on purpose (<b>exposure</b>) and choose not to do the compulsion (<b>response prevention</b>). It is uncomfortable by design, and that discomfort is the doorway, not a sign something is wrong.</p>' +

    '<h3>What you’re actually learning</h3>' +
    '<p>The goal isn’t to force the distress to zero, and it isn’t to prove the feared thing can’t happen. It’s new learning: that you can feel this and not act on it, and that the outcome you dreaded either doesn’t come or isn’t the catastrophe the fear promised. That’s why logging asks what you <b>expected</b> and what actually <b>happened</b> — the gap between them is where the change lives.</p>' +

    '<h3>How to use it</h3>' +
    '<p>Build a <b>ladder</b> of situations you avoid or ritualize around, each rated for how much distress you expect (0–100). Start where you can — lower steps are a common way in — but repeating and varying an exposure matters more than climbing in strict order. Log each one: how high the distress went, whether you held off the compulsion, what you expected, and what happened. Over time the record is yours to see.</p>' +

    '<h3>Honest limits</h3>' +
    '<div class="care">' +
      '<p>This tool can’t tell whether an exposure is safe or wise for you — that judgment is yours, and ideally your therapist’s. Some obsessions — around harm, or where a real danger is genuinely possible — need a professional to plan exposures safely; please don’t design those alone from an app.</p>' +
      '<p>If exposures are leaving you more distressed over weeks rather than steadier, or you feel worse, that’s a signal to slow down and bring in a person — not to push harder. We’d rather you close this and call someone than treat a rising number as a target to beat.</p>' +
    '</div>' +

    '<h3>Finding ERP care</h3>' +
    '<p>The International OCD Foundation keeps a directory of ERP-trained therapists and free guidance: <a href="https://iocdf.org" target="_blank" rel="noopener">iocdf.org</a>. If you’re in crisis right now, this isn’t the place — call or text <a href="tel:988">988</a> (US) or your local emergency line.</p>' +
  '</div>';
}

// ── render dispatch ─────────────────────────────────────────────────────────
let mainEl;
function render() {
  document.querySelectorAll('.mode-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.view === ui.view); });
  let h;
  if (ui.view === 'ladder') h = renderLadder();
  else if (ui.view === 'progress') h = renderProgress();
  else h = renderGuide();
  mainEl.innerHTML = h;
}

// ── sheet (add / edit / log) ────────────────────────────────────────────────
const overlay = document.getElementById('sheet-overlay');
const sheetBody = document.getElementById('sheet-body');
function openSheet(html) { sheetBody.innerHTML = html; overlay.classList.remove('hidden'); }
function closeSheet() { overlay.classList.add('hidden'); sheetBody.innerHTML = ''; }
overlay.addEventListener('click', function (e) { if (e.target === overlay) closeSheet(); });
sheetBody.addEventListener('click', function (e) {
  const b = e.target.closest('[data-act]');
  if (b && b.dataset.act === 'sheet-cancel') closeSheet();
});

function sudsField(id, label, val) {
  return '<label class="fld"><span class="fld-label">' + label + '<b class="suds-val" data-for="' + id + '">' + val + '</b></span>' +
    '<input type="range" class="suds" id="' + id + '" min="0" max="100" value="' + val + '">' +
    '<span class="suds-anchors"><span>calm</span><span>worst imaginable</span></span></label>';
}
function wireSUDS() {
  sheetBody.querySelectorAll('input.suds').forEach(function (r) {
    const b = sheetBody.querySelector('.suds-val[data-for="' + r.id + '"]');
    r.addEventListener('input', function () { if (b) b.textContent = r.value; });
  });
}

function openItemSheet(id) {
  const it = id ? state.items[id] : null;
  const a = it ? it.anticipated : 50;
  openSheet(
    '<h3 class="sheet-h">' + (it ? 'Edit step' : 'Add a step') + '</h3>' +
    '<label class="fld"><span class="fld-label">A short name for it</span>' +
      '<input type="text" id="f-title" maxlength="200" placeholder="e.g. Touch the door handle, don’t wash" value="' + (it ? esc(it.title) : '') + '"></label>' +
    '<label class="fld"><span class="fld-label">The situation you face <span class="opt">optional</span></span>' +
      '<textarea id="f-situation" rows="2" maxlength="2000" placeholder="What you’d approach or do on purpose">' + (it ? esc(it.situation) : '') + '</textarea></label>' +
    '<label class="fld"><span class="fld-label">The fear underneath <span class="opt">optional</span></span>' +
      '<textarea id="f-obsession" rows="2" maxlength="2000" placeholder="The thought or feared outcome that shows up">' + (it ? esc(it.obsession) : '') + '</textarea></label>' +
    '<label class="fld"><span class="fld-label">What you’ll hold off doing <span class="opt">optional</span></span>' +
      '<textarea id="f-ritual" rows="2" maxlength="2000" placeholder="The compulsion or avoidance you’ll resist — washing, checking, reassurance…">' + (it ? esc(it.ritual) : '') + '</textarea></label>' +
    sudsField('f-anticipated', 'How much distress do you expect?', a) +
    '<div class="sheet-actions"><button class="btn" data-act="sheet-cancel">Cancel</button>' +
      '<button class="btn primary" id="f-save">' + (it ? 'Save' : 'Add step') + '</button></div>'
  );
  wireSUDS();
  sheetBody.querySelector('#f-save').addEventListener('click', function () {
    const titleEl = sheetBody.querySelector('#f-title');
    const title = titleEl.value.trim();
    if (!title) { titleEl.focus(); return; }
    const anticipated = clampSUDS(sheetBody.querySelector('#f-anticipated').value);
    const situation = sheetBody.querySelector('#f-situation').value.trim();
    const obsession = sheetBody.querySelector('#f-obsession').value.trim();
    const ritual = sheetBody.querySelector('#f-ritual').value.trim();
    if (it) {
      it.title = title; it.situation = situation; it.obsession = obsession; it.ritual = ritual; it.anticipated = anticipated; it.updated = now();
    } else {
      const nid = uid();
      state.items[nid] = { id: nid, title: title, situation: situation, obsession: obsession, ritual: ritual, anticipated: anticipated, status: 'active', order: Object.keys(state.items).length, created: now(), updated: now() };
    }
    save(); closeSheet(); render(); toast(it ? 'Saved.' : 'Step added.');
  });
}

function openLogSheet(id) {
  const it = state.items[id];
  if (!it) return;
  let chosen = null;
  openSheet(
    '<h3 class="sheet-h">Log an exposure</h3>' +
    '<div class="sheet-sub">' + esc(it.title) + '</div>' +
    sudsField('l-pre', 'Distress before you started', 30) +
    sudsField('l-peak', 'Peak distress during', 60) +
    sudsField('l-end', 'Distress by the end', 30) +
    '<div class="fld"><span class="fld-label">Did you hold off the compulsion?</span>' +
      '<div class="choice" id="l-resisted">' +
        '<button type="button" class="ch" data-val="full">Held it</button>' +
        '<button type="button" class="ch" data-val="partial">Mostly</button>' +
        '<button type="button" class="ch" data-val="none">Not this time</button>' +
      '</div></div>' +
    '<label class="fld"><span class="fld-label">What did you expect would happen? <span class="opt">optional</span></span>' +
      '<textarea id="l-expected" rows="2" maxlength="2000" placeholder="' + (it.obsession ? esc(it.obsession) : 'The feared outcome') + '"></textarea></label>' +
    '<label class="fld"><span class="fld-label">What actually happened? <span class="opt">optional</span></span>' +
      '<textarea id="l-happened" rows="2" maxlength="2000" placeholder="What you noticed — including that nothing did"></textarea></label>' +
    '<label class="fld"><span class="fld-label">Anything you learned or want to remember <span class="opt">optional</span></span>' +
      '<textarea id="l-note" rows="2" maxlength="2000"></textarea></label>' +
    '<label class="fld inline"><span class="fld-label">How long? <span class="opt">optional</span></span>' +
      '<input type="number" id="l-minutes" min="0" max="600" placeholder="min" class="mins"></label>' +
    '<div class="sheet-actions"><button class="btn" data-act="sheet-cancel">Cancel</button>' +
      '<button class="btn primary" id="l-save">Save exposure</button></div>'
  );
  wireSUDS();
  const grp = sheetBody.querySelector('#l-resisted');
  grp.addEventListener('click', function (e) {
    const b = e.target.closest('.ch');
    if (!b) return;
    chosen = b.dataset.val;
    grp.querySelectorAll('.ch').forEach(function (x) { x.classList.toggle('sel', x === b); });
  });
  sheetBody.querySelector('#l-save').addEventListener('click', function () {
    const minsRaw = parseInt(sheetBody.querySelector('#l-minutes').value, 10);
    state.sessions.push({
      id: uid(), itemId: it.id, ts: now(),
      preSUDS: clampSUDS(sheetBody.querySelector('#l-pre').value),
      peakSUDS: clampSUDS(sheetBody.querySelector('#l-peak').value),
      endSUDS: clampSUDS(sheetBody.querySelector('#l-end').value),
      resisted: chosen,
      expected: sheetBody.querySelector('#l-expected').value.trim(),
      happened: sheetBody.querySelector('#l-happened').value.trim(),
      note: sheetBody.querySelector('#l-note').value.trim(),
      minutes: (isFinite(minsRaw) && minsRaw > 0) ? minsRaw : null,
      created: now(),
    });
    ui.expanded.add(it.id);
    save();
    if (window.HCUsage) HCUsage.mark('erp');   // the moment the practice actually happens
    closeSheet(); render(); toast('Logged. That took something.');
  });
}

// ── toast ───────────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
}

// ── main click delegation ───────────────────────────────────────────────────
mainEl = document.getElementById('app-main');
mainEl.addEventListener('click', function (e) {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act !== 'del-item' && ui.confirmKey) { ui.confirmKey = null; render(); }
  if (act === 'add-item') openItemSheet(null);
  else if (act === 'edit-item') openItemSheet(id);
  else if (act === 'log') openLogSheet(id);
  else if (act === 'toggle-detail') { if (ui.expanded.has(id)) ui.expanded.delete(id); else ui.expanded.add(id); render(); }
  else if (act === 'rest-item') { const it = state.items[id]; if (it) { it.status = it.status === 'resting' ? 'active' : 'resting'; it.updated = now(); save(); render(); } }
  else if (act === 'del-item') {
    if (ui.confirmKey === 'del:' + id) {
      ui.confirmKey = null;
      delete state.items[id];
      state.sessions = state.sessions.filter(function (s) { return s.itemId !== id; });
      ui.expanded.delete(id);
      save(); render(); toast('Step removed.');
    } else { ui.confirmKey = 'del:' + id; render(); }
  }
  else if (act === 'goto') { ui.view = b.dataset.view; ui.confirmKey = null; render(); }
});

document.querySelectorAll('.mode-btn').forEach(function (b) {
  b.addEventListener('click', function () { ui.view = b.dataset.view; ui.confirmKey = null; render(); });
});

// ── export / import / delete (your data is yours) ───────────────────────────
function exportData() {
  const payload = { app: 'erp', schema: 1, exported: now(), state: state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = 'erp-' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
async function importData(file) {
  try {
    const parsed = JSON.parse(await file.text());
    const incoming = parsed && parsed.state ? parsed.state : parsed;
    if (!incoming || typeof incoming !== 'object' || (typeof incoming.items !== 'object' && !Array.isArray(incoming.sessions))) {
      throw new Error('not an ERP export');
    }
    state = normalize(incoming);
    ui.expanded = new Set(); ui.confirmKey = null;
    save(); render();
    if (window.HCSync && HCSync.queueBlobPush) HCSync.queueBlobPush(SYNC_BLOB_KEY);
    toast('Imported your ladder and record.');
  } catch (err) {
    alert('Import failed: ' + err.message);
  }
}
function eraseEverything() {
  try { localStorage.removeItem(STATE_KEY); } catch (e) { /* ignore */ }
  state = { v: 1, items: {}, sessions: [] };
  ui.expanded = new Set(); ui.confirmKey = null;
  save(); setMenu(false); render();
}

// ── corner menu wiring ──────────────────────────────────────────────────────
const menuEl = document.getElementById('menu');
const menuBtn = document.getElementById('menu-btn');
const menuPanel = document.getElementById('menu-panel');
const importFile = document.getElementById('import-file');
const eraseBtn = document.getElementById('erase-btn');
const eraseSub = document.getElementById('erase-sub');
let eraseArmed = false;
function setMenu(open) {
  menuPanel.classList.toggle('hidden', !open);
  menuEl.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (!open) resetEraseButton();
}
function resetEraseButton() {
  eraseArmed = false;
  eraseBtn.querySelector('.menu-item-title').textContent = 'Delete everything';
  eraseSub.textContent = 'Your ladder and record, gone for real';
}
menuBtn.addEventListener('click', function () { setMenu(menuPanel.classList.contains('hidden')); });
document.addEventListener('click', function (e) { if (!menuEl.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { setMenu(false); if (!overlay.classList.contains('hidden')) closeSheet(); }
});
document.getElementById('export-btn').addEventListener('click', function () { setMenu(false); exportData(); });
document.getElementById('import-btn').addEventListener('click', function () { setMenu(false); importFile.click(); });
importFile.addEventListener('change', function (e) { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; });
eraseBtn.addEventListener('click', function () {
  if (eraseArmed) { eraseEverything(); return; }
  eraseArmed = true;
  eraseBtn.querySelector('.menu-item-title').textContent = 'Tap again to erase';
  eraseSub.textContent = (window.HCSync && HCSync.isUnlocked && HCSync.isUnlocked())
    ? 'Clears THIS device — synced copy stays'
    : 'This cannot be undone';
});

// ── sync status wiring (sign-in / account management lives at the hub) ───────
const syncStatusEl = document.getElementById('sync-status');
const syncDot = document.getElementById('sync-dot');
const syncNoteEl = document.getElementById('sync-note');
const syncManageSub = document.getElementById('sync-manage-sub');
function updateSyncUI(st) {
  const signedOut = st.state === 'signed_out';
  const locked = st.state === 'locked';
  const unlocked = st.state === 'unlocked';
  const notConfigured = st.error === 'not_configured';
  let txt, manage;
  if (notConfigured) { txt = 'Sync not configured'; manage = 'Set up at the hub'; }
  else if (signedOut) { txt = 'This device only — not signed in'; manage = 'Sign in at the hub'; }
  else if (locked) { txt = 'Signed in · locked'; manage = 'Unlock at the hub'; }
  else if (st.syncing) { txt = 'Syncing…'; manage = 'Account & sign-out'; }
  else if (st.error && st.error !== 'offline') { txt = 'Sync issue — ' + st.error; manage = 'Account & sign-out'; }
  else if (!st.online || st.error === 'offline') { txt = 'Offline — will sync when back'; manage = 'Account & sign-out'; }
  else { txt = 'Synced · ' + (st.email || ''); manage = 'Account & sign-out'; }
  if (syncStatusEl) syncStatusEl.textContent = txt;
  if (syncManageSub) syncManageSub.textContent = manage;
  if (syncDot) {
    syncDot.className = '';
    if (!notConfigured && !signedOut) {
      syncDot.classList.add('on');
      if (st.syncing) syncDot.classList.add('busy');
      else if (st.error && st.error !== 'offline') syncDot.classList.add('err');
      else if (locked || !st.online || st.error === 'offline') syncDot.classList.add('warn');
      else syncDot.classList.add('ok');
    }
  }
  if (syncNoteEl) syncNoteEl.textContent = unlocked
    ? 'End-to-end encrypted — the server stores only unreadable ciphertext.'
    : 'Your plan and record live on this device. Sign in at the hub to sync them, encrypted, across devices.';
}

// ── init ────────────────────────────────────────────────────────────────────
document.getElementById('version-label').textContent = VERSION;
load();
render();

// ── cross-device sync (opt-in, end-to-end encrypted; see hc-sync.js) ────────
// One LWW blob for the whole app (ladder + session record). Sensitive prose
// (obsessions, feared outcomes) is protected by the same zero-knowledge
// envelope as the journal; whole-blob last-write-wins means a concurrent edit
// on two devices in one sync window keeps only the later — acceptable for one
// person across their own devices at Tier 0, flagged in KNOWN_RISKS.
if (window.HCSync) {
  HCSync.registerStore({
    key: SYNC_BLOB_KEY, kind: 'blob',
    read: function () { return localStorage.getItem(STATE_KEY) || JSON.stringify(state); },
    write: function (str) {                 // remote-apply path — deliberately NOT through save()
      try { localStorage.setItem(STATE_KEY, str); } catch (e) { /* quota */ }
      load();
      if (!overlay.classList.contains('hidden')) closeSheet();   // a sheet's target may be gone
      render();
    },
  });
  HCSync.subscribe(updateSyncUI);
  HCSync.init({ supabaseUrl: SUPABASE_URL, supabaseAnonKey: SUPABASE_ANON_KEY, appId: 'erp' });
}
</script>

<!-- ── PWA: register the service worker for offline use ──────── -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () { /* offline is best-effort */ });
  });
}
</script>
