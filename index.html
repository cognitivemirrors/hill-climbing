<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0e14">
  <title>Hill Climbing</title>
  <style>
    :root {
      /* ── Hill Climbing — shared design tokens ─────────────────── */
      --bg-base: #0a0b12;
      --text:  rgba(255,255,255,0.86);
      --mid:   rgba(255,255,255,0.52);
      --dim:   rgba(255,255,255,0.34);
      --faint: rgba(255,255,255,0.16);
      --line:  rgba(255,255,255,0.10);
      --panel: rgba(255,255,255,0.04);
      --font-display: Georgia, 'Times New Roman', serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --bg: var(--bg-base);        /* legacy alias */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%;
      background:
        radial-gradient(ellipse 80% 60% at 50% 38%, rgba(40,40,72,0.30), transparent 70%),
        var(--bg-base);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 56px 22px;
      user-select: none;
    }

    /* ── Masthead ─────────────────────────────────────────────── */
    header { text-align: center; margin-bottom: 52px; animation: fadeUp 0.7s ease; }
    h1 {
      font-family: var(--font-display); font-weight: 400;
      font-size: 2.1rem; letter-spacing: 0.36em;
      text-indent: 0.36em; /* offset the trailing letter-space so it reads centred */
      color: var(--text); text-transform: uppercase;
      text-shadow: 0 0 48px rgba(150,140,210,0.22);
    }
    header p {
      font-family: var(--font-display); font-style: italic;
      margin-top: 16px; font-size: 0.95rem; color: var(--dim);
      letter-spacing: 0.04em;
    }

    /* ── Cards ────────────────────────────────────────────────── */
    nav {
      display: flex; gap: 18px; flex-wrap: wrap;
      justify-content: center; max-width: 720px; width: 100%;
    }
    .card {
      flex: 1 1 200px; max-width: 220px; min-width: 0;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; text-decoration: none;
      padding: 32px 22px 28px;
      background: var(--panel);
      border: 1px solid var(--line); border-radius: 18px;
      color: var(--text); cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease,
                  background 0.25s ease, box-shadow 0.25s ease;
      animation: fadeUp 0.7s ease backwards;
    }
    .card:nth-child(1) { animation-delay: 0.06s; }
    .card:nth-child(2) { animation-delay: 0.13s; }
    .card:nth-child(3) { animation-delay: 0.20s; }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.055);
      border-color: var(--accent-soft);
      box-shadow: 0 14px 40px rgba(0,0,0,0.35), 0 0 30px var(--accent-glow);
      outline: none;
    }
    .glyph {
      width: 46px; height: 46px; margin-bottom: 20px;
      color: var(--dim); transition: color 0.25s ease;
    }
    .card:hover .glyph, .card:focus-visible .glyph { color: var(--accent); }
    .glyph svg { width: 100%; height: 100%; display: block; }
    .card h2 {
      font-family: var(--font-display); font-weight: 400;
      font-size: 1.05rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text); margin-bottom: 9px;
    }
    .card p {
      font-size: 0.78rem; line-height: 1.55;
      color: var(--mid); letter-spacing: 0.02em;
    }

    /* Per-card accents */
    .card.meditate { --accent: #b9a8f0; --accent-soft: rgba(160,140,220,0.45); --accent-glow: rgba(140,120,210,0.16); }
    .card.breathe  { --accent: hsl(200,76%,68%); --accent-soft: hsla(200,76%,66%,0.45); --accent-glow: hsla(200,76%,60%,0.16); }
    .card.reflect  { --accent: hsl(38,80%,66%);  --accent-soft: hsla(38,75%,64%,0.45);  --accent-glow: hsla(38,75%,58%,0.15); }

    /* ── Footer ───────────────────────────────────────────────── */
    footer {
      margin-top: 52px; font-size: 0.62rem; color: var(--faint);
      letter-spacing: 0.2em; text-transform: uppercase;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; letter-spacing: 0.34em; text-indent: 0.34em; }
      header { margin-bottom: 40px; }
      nav { flex-direction: column; align-items: stretch; max-width: 340px; }
      .card { max-width: none; flex-basis: auto; flex-direction: row; gap: 18px; text-align: left; padding: 20px 22px; align-items: center; }
      .glyph { width: 34px; height: 34px; margin-bottom: 0; flex: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      header, .card { animation: none; }
      .card:hover, .card:focus-visible { transform: none; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Hill Climbing</h1>
    <p>three practices for coming back to yourself</p>
  </header>

  <nav>
    <a class="card meditate" href="meditate.html">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round">
          <circle cx="24" cy="24" r="18" stroke-width="1.6"/>
          <circle cx="24" cy="24" r="11" stroke-width="1.3" opacity="0.7"/>
          <circle cx="24" cy="24" r="2.4" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <h2>Meditate</h2>
      <p>Settle into stillness with camera-guided practice.</p>
    </a>

    <a class="card breathe" href="breathe.html">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M5 24c5 0 5-9 9.5-9s4.5 18 9.5 18 5-18 9.5-18S43 24 43 24"/>
        </svg>
      </span>
      <h2>Breathe</h2>
      <p>Train your nervous system to recover faster.</p>
    </a>

    <a class="card reflect" href="reflect.html">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="13" y1="16" x2="35" y2="16"/>
          <line x1="13" y1="24" x2="35" y2="24"/>
          <line x1="13" y1="32" x2="27" y2="32"/>
        </svg>
      </span>
      <h2>Reflect</h2>
      <p>Notice what's present and write it down.</p>
    </a>
  </nav>

  <footer>hill climbing · private · on-device</footer>

</body>
</html>
