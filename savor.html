<head>

  <meta name="theme-color" content="#0a0b12">
  <title>Savor · Hill Climbing</title>
  <!-- Savor is now the Taste season inside Nourish (nourish v0.17). Send anyone
       who lands here (an old bookmark, a home-screen shortcut, a #cN episode
       deep-link) into the Taste season, mapping any #cN / #gN / #m… episode hash
       to #taste-<id>. JS redirect first; meta-refresh as a no-JS fallback. -->
  <link rel="canonical" href="/nourish.html#taste">
  <script>
    (function () {
      var h = (location.hash || '').replace(/^#/, '');
      var target = '/nourish.html#taste' + (h && h !== 'taste' ? '-' + h : '');
      try { location.replace(target); } catch (e) { location.href = target; }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/nourish.html#taste">
  <style>
    html, body { background: #0a0b12; color: rgba(255,255,255,0.55);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    a { color: hsl(322,60%,72%); text-decoration: none; border-bottom: 1px solid hsla(322,56%,66%,0.5); }
  </style>
</head>
<body>
  <p>Savor has moved into Nourish’s Taste season. <a href="/nourish.html#taste">Continue&nbsp;→</a></p>
