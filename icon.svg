<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#080810"/>
  <!-- soft glow discs (solid fills approximate a radial glow) -->
  <circle cx="256" cy="248" r="190" fill="#13132a"/>
  <circle cx="256" cy="248" r="150" fill="#191832"/>
  <circle cx="256" cy="248" r="112" fill="#1d1c3a"/>
  <!-- faint outer track -->
  <circle cx="256" cy="256" r="138" fill="none" stroke="#3a3658" stroke-width="6" stroke-opacity="0.6"/>
  <!-- the stillness ring -->
  <circle cx="256" cy="256" r="138" fill="none" stroke="#9080d0" stroke-width="11" stroke-linecap="round"/>
  <!-- inner accent ring -->
  <circle cx="256" cy="256" r="74" fill="none" stroke="#6a5fa0" stroke-width="3" stroke-opacity="0.7"/>
  <!-- centre point — the still core -->
  <circle cx="256" cy="256" r="13" fill="#e2dcff"/>
</svg>
