    root.appendChild(card);
  });
  const ar=el('div','composer'); const ai=el('input','field'); ai.placeholder='new role name…'; const ab=el('button','btn small','Add role'); ab.style.alignSelf='flex-start'; ab.onclick=()=>{ try{ addRole(ai.value); ai.value=''; render(); }catch(e){ toast(e.message); } }; ar.appendChild(ai); ar.appendChild(ab); root.appendChild(ar);
}

// ── Clones + time travel ─────────────────────────────────────────────────────────
function renderClones(root, st){
  if(openClone&&st.clones[openClone]) return renderCloneChat(root, st, openClone);
  root.appendChild(el('p','lede','A clone is you, frozen at a point in the log, set loose to diverge (Kin\'s model). Family name is yours; the clone proposes its own given name. Spawn from now, or travel back and spawn an older you.'));
  // time-travel control
  const tt=el('div','card'); tt.style.marginBottom='.8rem';
  tt.appendChild(el('div','sect-h','Time travel'));
  const n=world.events.length;
  const cur = ttSeq==null? n : ttSeq;
  const sl=el('input'); sl.type='range'; sl.min='1'; sl.max=String(n); sl.value=String(cur); sl.style.width='100%';
  const lab=el('div','muted','viewing the world folded up to event '+cur+' of '+n+(ttSeq==null?' (now)':' (past)'));
  sl.oninput=()=>{ ttSeq = (Number(sl.value)>=n? null : Number(sl.value)); lab.textContent='viewing the world folded up to event '+(ttSeq==null?n:ttSeq)+' of '+n+(ttSeq==null?' (now)':' (past)'); renderTTPreview(prev, ttSeq==null?n:ttSeq); spawn.textContent = ttSeq==null? 'Spawn a clone from now' : ('Spawn a clone from event '+ttSeq); };
  tt.appendChild(sl); tt.appendChild(lab);
  const prev=el('div'); prev.style.marginTop='.5rem'; tt.appendChild(prev); renderTTPreview(prev, cur);
  const spawn=el('button','btn small'); spawn.textContent = ttSeq==null? 'Spawn a clone from now' : ('Spawn a clone from event '+ttSeq);
  spawn.onclick=()=>{ try{ const id=spawnClone(ttSeq==null?null:ttSeq); toast('Clone spawned — it will propose a name.'); if(apiKey) proposeCloneName(id); render(); }catch(e){ toast(e.message); } };
  tt.appendChild(spawn); root.appendChild(tt);
  // clone roster
  root.appendChild(el('div','sect-h','Your clones'));
  const ids=Object.keys(st.clones);
  if(!ids.length) root.appendChild(el('div','empty','No clones yet.'));
  ids.forEach(id=>{
    const c=st.clones[id]; const card=el('div','roomcard');
    const top=el('div','top'); top.appendChild(el('div','nm', (c.givenName||'Unnamed')+' '+c.familyName)); top.appendChild(el('div','ty','born @event '+c.bornAtSeq)); card.appendChild(top);
    if(c.naming.status!=='approved'){
      card.appendChild(el('div','muted', c.naming.status==='pending'? ('proposes “'+c.naming.proposed+'” — '+c.naming.rationale) : 'awaiting a name proposal'));
      const row=el('div','acts');
      if(c.naming.status==='pending'){ const ap=el('button','btn small','Bless “'+c.naming.proposed+'”'); ap.onclick=()=>{ try{ approveCloneName(id); render(); }catch(e){ toast(e.message); } }; const rt=el('button','btn small ghost','Send back'); rt.onclick=()=>{ const f=prompt('Feedback for the name:'); if(f!=null){ returnCloneName(id,f); if(apiKey)proposeCloneName(id); render(); } }; row.appendChild(ap); row.appendChild(rt); }
      else { const pr=el('button','btn small','Ask it to propose'); pr.onclick=()=>proposeCloneName(id); const mn=el('button','btn small ghost','Name by hand'); mn.onclick=()=>{ const nnm=prompt('Give it a name:'); if(nnm&&nnm.trim()){ proposeCloneNameState(id,nnm,'(named by hand)'); render(); } }; row.appendChild(pr); row.appendChild(mn); }
      card.appendChild(row);
    } else {
      const row=el('div','acts');
      const chat=el('button','btn small','Chat'); chat.onclick=()=>{ openClone=id; render(); };
      const promote=el('button','btn small ghost', st.actors[id]?'is an actor':'Make an actor');
      promote.disabled=!!st.actors[id];
      promote.onclick=()=>{ // promote clone to an actor so it can be placed in rooms and take turns
        emit('actor.add',{id, kind:'agent', label:(c.givenName||'Unnamed')+' '+c.familyName, role:'character', owner:'owner'}); toast('Now an actor — place it in a room to take turns.'); render(); };
      row.appendChild(chat); row.appendChild(promote); card.appendChild(row);
    }
    const x=el('button','btn small ghost','Delete'); x.onclick=()=>{ if(confirm('Delete this clone?')){ removeClone(id); if(st.actors[id])removeActor(id); if(acting===id)acting='owner'; render(); } }; card.appendChild(x);
    root.appendChild(card);
  });
}
function renderTTPreview(host, upto){ host.innerHTML=''; const past=reduceUpTo(upto); host.appendChild(el('div','muted','Then: '+(past.ownerName||'—')+' · '+past.values.length+' values · '+past.goals.length+' goals · '+past.tasks.length+' tasks · '+Object.keys(past.clones).length+' clones')); }
function renderCloneChat(root, st, id){
  const c=st.clones[id];
  const back=el('button','btn small ghost','‹ Clones'); back.onclick=()=>{ openClone=null; render(); }; root.appendChild(back);
  root.appendChild(el('h1',null,(c.givenName||'Unnamed')+' '+c.familyName));
  root.appendChild(el('p','muted','Born from your world log at event '+c.bornAtSeq+'. It shares that past but is its own person now.'));
  const convo=el('div','convo'); (c.thread||[]).forEach(m=>{ const box=el('div','msg '+(m.role==='assistant'?'agent':'')); const who=el('div','who'); who.appendChild(el('span','chip '+(m.role==='assistant'?'agent':'human'), m.role==='assistant'?'agent':'you')); who.appendChild(el('span','nm', m.role==='assistant'?((c.givenName||'')+' '+c.familyName):'You')); box.appendChild(who); box.appendChild(el('div','bd',m.text)); convo.appendChild(box); });
  if(!c.thread.length) convo.appendChild(el('div','empty','Say hello.'));
  root.appendChild(convo);
  root.appendChild(document.getElementById('typing-slot')||typingSlot());
  const comp=el('div','composer'); const ta=el('textarea','field'); ta.rows=2; ta.placeholder='talk to '+(c.givenName||'the clone')+'…';
  const b=el('button','btn small','Send'); b.onclick=()=>{ if(ta.value.trim()){ const t=ta.value; ta.value=''; converseWithClone(id, t); } };
  comp.appendChild(ta); comp.appendChild(b); root.appendChild(comp);
}

// ── Budget ───────────────────────────────────────────────────────────────────────
function renderBudget(root, st){
  root.appendChild(el('p','lede','The token budget sets how far agents advance without a human in the room. Metering is a hard rule — no spending what you don\'t have — above a subsistence floor no setting strips (the care value, made material).'));
  const b=st.budget; const spent=totalSpent(st); const remaining=unattendedRemaining(st);
  const bar=el('div','bar'); const usable=Math.max(1,b.pool-b.subsistence); const i=el('i'); const pct=Math.min(100, Math.round((spent/usable)*100)); i.style.width=pct+'%'; if(remaining<b.tickCap)i.className='floorwarn'; bar.appendChild(i); root.appendChild(bar);
  root.appendChild(el('div','muted', 'pool '+b.pool+' · subsistence floor '+b.subsistence+' · spent '+spent+' · '+remaining+' left for unattended turns'));
  const card=el('div','card'); card.style.marginTop='.8rem';
  const num=(label, val, fn, hint)=>{ const row=el('div','row'); row.style.margin='.35rem 0'; const l=el('label','muted',label); l.style.minWidth='11rem'; row.appendChild(l); const inp=el('input','field'); inp.type='number'; inp.value=val; inp.style.maxWidth='9rem'; inp.onchange=()=>{ try{ fn(inp.value); render(); }catch(e){ toast(e.message); } }; row.appendChild(inp); if(hint)row.appendChild(el('span','muted',hint)); return row; };
  card.appendChild(num('Surplus pool (tokens)', b.pool, v=>setBudget({pool:v})));
  card.appendChild(num('Subsistence floor', b.subsistence, v=>setBudget({subsistence:v}), 'never spent by unattended turns'));
  card.appendChild(num('Unattended per-tick cap', b.tickCap, v=>setBudget({tickCap:v}), 'max tokens per slow tick'));
  card.appendChild(num('Slow-tick throttle (ms)', b.throttleMs, v=>setBudget({throttleMs:v}), 'min gap between unattended turns'));
  const reset=el('button','btn small ghost','Reset spend (jubilee)'); reset.style.marginTop='.5rem'; reset.onclick=()=>{ resetBudget(); render(); toast('Spend reset. The record is untouched.'); };
  card.appendChild(reset); root.appendChild(card);
  root.appendChild(el('div','floor-note','Speed rule: a human in the room → agents respond immediately; no human → agents advance slowly (throttled) and only while budget remains above the floor. Unattended background stepping (a runtime with no one watching) is deferred + gated — here you step it by hand.'));
}

// ── World log ────────────────────────────────────────────────────────────────────
function renderLog(root, st){
  root.appendChild(el('p','lede','The append-only world log — the spine. State is a fold over this; it is also exactly what an LLM acting in the world reads as context. Old spans compress into a single summary event.'));
  const n=world.events.length;
  const r=el('div','row'); r.appendChild(el('span','muted', n+' events'));
  const cb=el('button','btn small ghost', n>COMPACT_AFTER?'Compact old history':'Compact (needs '+(COMPACT_AFTER+1)+'+ events)'); cb.disabled=n<=COMPACT_AFTER; cb.onclick=()=>{ try{ compact(); render(); toast('Old history folded into a summary event.'); }catch(e){ toast(e.message); } };
  r.appendChild(cb);
  const ctxB=el('button','btn small ghost','Show LLM context'); ctxB.onclick=()=>{ const panel=document.getElementById('menu-panel'); panel.innerHTML=''; panel.appendChild(el('div','menu-sub','What an agent in the Commons sees')); const pre=el('div','logline'); pre.style.whiteSpace='pre-wrap'; pre.style.fontFamily='var(--mono)'; const commons=Object.keys(st.rooms).find(k=>st.actors.owner&&st.rooms[k]); pre.textContent=worldContext(st, commons, 18); panel.appendChild(pre); document.getElementById('menu').classList.add('show'); };
  r.appendChild(ctxB); root.appendChild(r);
  const box=el('div'); box.style.marginTop='.6rem';
  world.events.slice().reverse().slice(0,200).forEach(e=>{
    const line=el('div','logline');
    if(e.type==='compaction'){ line.appendChild(el('span','ty','[compaction] ')); line.appendChild(document.createTextNode(e.payload.summary)); }
    else { const s=el('span','ty', e.type+' '); line.appendChild(s); const a=el('span','ac', actorName(st,e.actor)+' '); line.appendChild(a); line.appendChild(document.createTextNode(logDetail(e))); }
    box.appendChild(line);
  });
  root.appendChild(box);
}
function logDetail(e){ const p=e.payload||{}; return [p.text,p.label,p.name,p.title,p.question, (p.roomId?('→ '+p.roomId):null)].filter(Boolean).join(' ').slice(0,120); }

// ── Menu / export / import / erase ───────────────────────────────────────────────
function setMenu(o){ document.getElementById('menu').classList.toggle('show',o); if(o) renderMenu(); }
function renderMenu(){
  const p=document.getElementById('menu-panel'); p.innerHTML='';
  const add=(l,fn,c)=>{ const b=el('button','menu-item'+(c?' '+c:''),l); b.onclick=()=>{ document.getElementById('menu').classList.remove('show'); fn(); }; p.appendChild(b); };
  add('Export world', exportData);
  add('Import world', importData);
  add('API key', ()=>{ const k=prompt('Anthropic key (sk-ant-…). Blank to remove.',''); if(k===null)return; if(k.trim()===''){ clearApiKey(); toast('Key removed.'); } else if(k.trim().startsWith('sk-ant-')){ writeApiKey(k.trim()); toast('Key set.'); } else toast('Not an sk-ant- key.'); render(); });
  p.appendChild(el('div','menu-sub','—'));
  add('About Rooms', ()=>{ toast('A single-device prototype of the world layer. See ROOMS.md.'); });
  add('Delete everything', eraseEverything, 'danger');
}
function exportData(){ const b=new Blob([JSON.stringify({app:'rooms',schema:1,exported:new Date().toISOString(),world})],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='rooms-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function importData(){ const i=document.createElement('input'); i.type='file'; i.accept='application/json'; i.onchange=async()=>{ const f=i.files[0]; if(!f)return; try{ const p=JSON.parse(await f.text()); const w=p.world||p; world={ v:1, onboarded:!!w.onboarded, events:Array.isArray(w.events)?w.events:[] }; save(); render(); toast('Imported.'); }catch(e){ toast('Import failed.'); } }; i.click(); }
let eraseArmed=false;
function eraseEverything(){ if(!eraseArmed){ eraseArmed=true; toast('Tap Delete everything again to erase this whole world.'); setTimeout(()=>eraseArmed=false,4000); setMenu(true); return; } eraseArmed=false; world={v:1,onboarded:false,events:[]}; save(); acting='owner'; view='rooms'; openRoom=null; openClone=null; render(); }

// ── Boot ─────────────────────────────────────────────────────────────────────────
document.getElementById('version-label').textContent=VERSION;
document.getElementById('menu-btn').onclick=()=>setMenu(true);
document.getElementById('menu').onclick=e=>{ if(e.target.id==='menu') document.getElementById('menu').classList.remove('show'); };
load(); apiKey=readApiKey(); render();

if(window.HCSync){
  HCSync.registerStore({ key:SYNC_BLOB_KEY, kind:'blob',
    read:()=>localStorage.getItem(STATE_KEY)||JSON.stringify(world),
    write:(str)=>{ try{ localStorage.setItem(STATE_KEY,str); }catch(_){} load(); render(); } });
  if(window.HCSyncChip) HCSyncChip.mount({position:'bottom-left'});
  HCSync.init({ supabaseUrl:SUPABASE_URL, supabaseAnonKey:SUPABASE_ANON_KEY, appId:'rooms' });
}

// ── Agent interface — state mutations only; every model call (turns, clone chat,
// the moderator, the research agent) is UI-only, the same human/agent boundary as
// every BYOK surface in the suite. An LLM can drive the ENTIRE world through these. ─
if(window.HC) HC.register({
  app:'rooms', version:VERSION, title:'Rooms',
  description:'A single-device prototype of the "rooms" world layer (ROOMS.md). An event-sourced world: every state change is an append-only event, folded into the current world; both humans and LLMs append through the same actions (REQUIREMENTS §1.4). Onboarding (name/values/goals-hierarchy/calendar/tasks); rooms + room types + instances + role-scoped permissions; clones + time travel (Kin\'s model); a turn scheduler (immediate with a human present, slow + token-metered without) with a cheap-model moderator; a BYOK research agent. Rooms writes only its own world store — never a practice store. Cross-account sharing, remote partner clone-sharing, and unattended autonomy are deferred + gated. Public seed data.',
  stores:[
    { key:STATE_KEY, kind:'localStorage', syncKey:SYNC_BLOB_KEY, sensitivity:'sensitive',
      description:'The event-sourced world: an append-only log of every state change (values, goals hierarchy, calendar, tasks, rooms, room types, roles, actors, clones, messages, budget), plus an onboarding flag. State is a reduction over the log; older spans fold into compaction events. Agents author only world/room events here — never a practice store.',
      schema:'{ v:1, onboarded:bool, events:[ { id, seq, ts, actor, room, type, payload } ] }  // types: world.init, owner.rename, value.*, goal.*, cal.*, task.*, roomtype.*, room.*, role.*, actor.*, enter, msg.send, research.result, clone.*, budget.*, compaction',
      afterWrite:()=>{ load(); render(); } },
  ],
  actions:{
    setOwnerName:{ description:'Set the world owner\'s name (and the family name clones inherit). The first call bootstraps the world.', params:{ name:'string' }, handler:(p)=>setOwnerName(p.name) },
    addValue:{ description:'Add a value to the profile.', params:{ text:'string' }, handler:(p)=>addValue(p.text) },
    editValue:{ description:'Edit a value.', params:{ id:'value id', text:'string' }, handler:(p)=>editValue(p.id,p.text) },
    removeValue:{ description:'Remove a value.', params:{ id:'value id' }, handler:(p)=>removeValue(p.id) },
    addGoal:{ description:'Add a goal, optionally nested under a parent goal (a hierarchy).', params:{ text:'string', parentId:'parent goal id or null' }, handler:(p)=>addGoal(p.text,p.parentId) },
    editGoal:{ description:'Edit a goal.', params:{ id:'goal id', text:'string' }, handler:(p)=>editGoal(p.id,p.text) },
    removeGoal:{ description:'Remove a goal and its sub-goals; untags affected tasks.', params:{ id:'goal id' }, handler:(p)=>removeGoal(p.id) },
    addCalEvent:{ description:'Add a calendar event.', params:{ title:'string', date:'YYYY-MM-DD or empty' }, handler:(p)=>addCalEvent(p.title,p.date) },
    removeCalEvent:{ description:'Remove a calendar event.', params:{ id:'event id' }, handler:(p)=>removeCalEvent(p.id) },
    addTask:{ description:'Add a task, optionally tagged to one or more goals.', params:{ text:'string', goalIds:'array of goal ids' }, handler:(p)=>addTask(p.text,p.goalIds) },
    tagTask:{ description:'Tag a task to a goal.', params:{ id:'task id', goalId:'goal id' }, handler:(p)=>tagTask(p.id,p.goalId) },
    toggleTask:{ description:'Toggle a task done/undone.', params:{ id:'task id' }, handler:(p)=>toggleTask(p.id) },
    removeTask:{ description:'Remove a task.', params:{ id:'task id' }, handler:(p)=>removeTask(p.id) },
    addRoomType:{ description:'Add a room type (every screen is a room type).', params:{ label:'string', verbs:'array like ["enter","act","leave"]', defaultPolicy:'{ [roleId]: perms[] }' }, handler:(p)=>addRoomType(p.label,p.verbs,p.defaultPolicy) },
    setRoomTypePolicy:{ description:'Set a room type\'s default permission policy (by role).', params:{ id:'room type id', policy:'{ [roleId]: perms[] }' }, handler:(p)=>setRoomTypePolicy(p.id,p.policy) },
    addRoom:{ description:'Add a room (an instance of a type — a second goals room is just another instance).', params:{ typeId:'room type id', label:'string' }, handler:(p)=>addRoom(p.typeId,p.label) },
    setRoomPolicy:{ description:'Override a room\'s permission policy (null inherits the type default).', params:{ id:'room id', policy:'{ [roleId]: perms[] } or null' }, handler:(p)=>setRoomPolicy(p.id,p.policy) },
    removeRoom:{ description:'Remove a room and its messages.', params:{ id:'room id' }, handler:(p)=>removeRoom(p.id) },
    addRole:{ description:'Add a role (a bundle of default room access).', params:{ label:'string', defaultRooms:'{ [roomId|typeId]: perms[] }' }, handler:(p)=>addRole(p.label,p.defaultRooms) },
    setRoleAccess:{ description:'Set a role\'s default access to a room or room type.', params:{ id:'role id', target:'room id or room type id', perms:'array of perms (empty to revoke)' }, handler:(p)=>setRoleAccess(p.id,p.target,p.perms) },
    addActor:{ description:'Add an actor (human or agent) with a role.', params:{ kind:"'human' | 'agent'", label:'string', role:'role id' }, handler:(p)=>addActor(p.kind,p.label,p.role) },
    setActorRole:{ description:'Change an actor\'s role.', params:{ id:'actor id', role:'role id' }, handler:(p)=>setActorRole(p.id,p.role) },
    removeActor:{ description:'Remove an actor (not the owner).', params:{ id:'actor id' }, handler:(p)=>removeActor(p.id) },
    enterRoom:{ description:'Move an actor into a room. Refused if the actor is not admitted (the authorization ring — refusals are first-class).', params:{ actorId:'actor id', roomId:'room id' }, handler:(p)=>enterRoom(p.actorId,p.roomId) },
    sendMessage:{ description:'Leave a message in a room, authored by the current acting actor. Refused if that actor may not leave here.', params:{ roomId:'room id', text:'string' }, handler:(p)=>sendMessage(p.roomId,p.text) },
    recordResearch:{ description:'Record a research artifact (finding + sources) left by an agent in a room. (The web search itself is UI-only.)', params:{ roomId:'room id', actorId:'author actor id', question:'string', finding:'string', sources:'array of {url,title}' }, handler:(p)=>recordResearch(p.roomId,p.actorId,p.question,p.finding,p.sources) },
    spawnClone:{ description:'Spawn a clone frozen from the world log (at the given event index, or HEAD). It inherits a frozen digest and diverges. Proposes its own given name.', params:{ atSeq:'event index to freeze at, or null for now' }, handler:(p)=>spawnClone(p.atSeq) },
    setCloneName:{ description:'Record a proposed given name for a clone (the naming handshake; the network proposal is UI-only).', params:{ id:'clone id', name:'string', rationale:'string' }, handler:(p)=>proposeCloneNameState(p.id,p.name,p.rationale) },
    approveCloneName:{ description:'Approve a clone\'s proposed given name.', params:{ id:'clone id' }, handler:(p)=>approveCloneName(p.id) },
    returnCloneName:{ description:'Return a clone\'s proposed name with feedback (reopens proposing).', params:{ id:'clone id', feedback:'string' }, handler:(p)=>returnCloneName(p.id,p.feedback) },
    cloneSay:{ description:'Append a turn to a clone\'s diverging thread (the network reply is UI-only).', params:{ id:'clone id', role:"'user' | 'assistant'", text:'string' }, handler:(p)=>cloneSay(p.id,p.role,p.text) },
    removeClone:{ description:'Delete a clone.', params:{ id:'clone id' }, handler:(p)=>removeClone(p.id) },
    setBudget:{ description:'Set the token budget that governs unattended agent advancement.', params:{ pool:'tokens', subsistence:'floor tokens', tickCap:'max tokens per slow tick', throttleMs:'min ms between unattended ticks' }, handler:(p)=>setBudget(p) },
    spendTokens:{ description:'Meter spend against the unattended budget. Refused if it would breach the subsistence floor — you cannot spend what you do not have.', params:{ actorId:'actor id', amount:'positive token count' }, handler:(p)=>spendTokens(p.actorId,p.amount) },
    resetBudget:{ description:'Reset spend to zero (a jubilee). Leaves the log untouched.', params:{}, handler:()=>resetBudget() },
    compact:{ description:'Fold the oldest span of the log into a single compaction summary event (the "context, compressed" step). Append-only: the summary replaces the span as one event.', params:{}, handler:()=>compact() },
  },
  notes:'Single-device prototype. The model calls (agent turns via runTurn, clone naming/chat, the moderator router, the research agent\'s web search) are UI-only — never HC actions, matching every BYOK surface in the suite. Rooms writes ONLY its own store (never a practice store), so REQUIREMENTS §1.4 stays literally true; the world log\'s per-event `actor` is authorship in a new world-layer store, outside §1.4\'s practice-store scope (WORLD_ARCHITECTURE §5). Cross-account friend/partner, remote clone-sharing, and unattended autonomy are deferred + gated on the framing decision + security/relational-safety reviews (ROOMS.md §1/§11). Public seed data.',
});
</script>
